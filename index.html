ning<\/div><br><div class='opt-line'><b>B.<\/b> Biplane screening<\/div><br><div class='opt-line'><b>C.<\/b> CT<\/div><br><div class='opt-line'><b>D.<\/b> Ultrasound<\/div><br><div class='opt-line'><b>E.<\/b> C-arm screening<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 4 › Exam 4 c","front":"<b>Regarding Gallium 67 scanning<\/b><br><div class='opt-line'><b>A.<\/b> Ga-citrate is taken up by normal nasal sinuses<\/div><br><div class='opt-line'><b>B.<\/b> Ga-citrate is taken up by bowel less than Indium-labelled leukocytes<\/div><br><div class='opt-line'><b>C.<\/b> Ga-citrate is given as an IV injection<\/div><br><div class='opt-line'><b>D.<\/b> Laxatives are given for two days prior to injection<\/div><br><div class='opt-line'><b>E.<\/b> Ga-citrate emits gamma rays at three principal energies<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; uptake of bowel is intense and more intense than indium labelled leukocytes .<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Laxatives are given for two days after the injection.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":34},{"section":"Exam 4 › Exam 4 c","front":"<b>Dilatation of oesophagus - technique<\/b><br><div class='opt-line'><b>A.<\/b> The pharynx should be anaesthetised first<\/div><br><div class='opt-line'><b>B.<\/b> A floppy guidewire should be passed first<\/div><br><div class='opt-line'><b>C.<\/b> Catheters are contraindicated<\/div><br><div class='opt-line'><b>D.<\/b> The largest balloon available should be used first<\/div><br><div class='opt-line'><b>E.<\/b> Angioplasty balloons are helpful<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A swallow study should be performed first to localise the stricture.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Catheters are not contraindicated, they are used in the procedure.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A gradual size increase should be used to avoid perforation.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":34},{"section":"Exam 4 › Exam 4 c","front":"<b>Vascular sheaths<\/b><br><div class='opt-line'><b>A.<\/b> Have sidearms<\/div><br><div class='opt-line'><b>B.<\/b> Have sideholes<\/div><br><div class='opt-line'><b>C.<\/b> Should be used for multiple catheter exchanges<\/div><br><div class='opt-line'><b>D.<\/b> Should not be used for thrombolysis<\/div><br><div class='opt-line'><b>E.<\/b> Should not be used for angioplasty<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; have no sideholes<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Vascular sheaths can be used for thrombolysis.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Vascular sheaths are used in angioplasty procedures.<\/div>","due":34},{"section":"Exam 4 › Exam 4 c","front":"<b>IVC Filter insertion<\/b><br><div class='opt-line'><b>A.<\/b> Always use a sheath<\/div><br><div class='opt-line'><b>B.<\/b> Always do a venogram first<\/div><br><div class='opt-line'><b>C.<\/b> IVC diameter should be at least 3 cm<\/div><br><div class='opt-line'><b>D.<\/b> Temporary caval filters should not be left in for more than 12-14 days<\/div><br><div class='opt-line'><b>E.<\/b> A bird&#x27;s nest should always be available<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; IVC filters come with their own sheath<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The IVC diameter should be at least 2.5 cm for filter insertion.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":34},{"section":"Exam 4 › Exam 4 c","front":"<b>Regarding radionuclide bone scans<\/b><br><div class='opt-line'><b>A.<\/b> Time activity curves are created from blood pool phase<\/div><br><div class='opt-line'><b>B.<\/b> Routine tomographic reconstructed images are obtained<\/div><br><div class='opt-line'><b>C.<\/b> There is good contrast between bone and soft tissues<\/div><br><div class='opt-line'><b>D.<\/b> Renal function can be estimated First 20-30 minutes<\/div><br><div class='opt-line'><b>E.<\/b> Complications of this procedure should be explained carefully to the patient<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; from arterial phase.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Tomographic images are obtained only if there is abnormality.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; No significant complications are known<\/div>","due":34},{"section":"Exam 4 › Exam 4 c","front":"<b>Regarding lymphangiography<\/b><br><div class='opt-line'><b>A.<\/b> The maximum dose of lipiodol for a 70 kg adult is 7 mls per side<\/div><br><div class='opt-line'><b>B.<\/b> Cytotoxic treatment in the past 3 weeks is a contraindication<\/div><br><div class='opt-line'><b>C.<\/b> The thoracic duct is not usually visualized until 24 hours after injection<\/div><br><div class='opt-line'><b>D.<\/b> The maximum reduction in Tco (carbon monoxide diffusion capacity) occurs in 12 hours<\/div><br><div class='opt-line'><b>E.<\/b> Some dermal backflow is normal<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The thoracic duct should be visible in 2 hours.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It occurs in 36 hours.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; no dermal backflow.<\/div>","due":35},{"section":"Exam 4 › Exam 4 c","front":"<b>Regarding ultrasound of the peripheral venous system<\/b><br><div class='opt-line'><b>A.<\/b> A 3-5 MHz probe is appropriate for superficial veins<\/div><br><div class='opt-line'><b>B.<\/b> Venous flow velocity in the arms decreases during inspiration<\/div><br><div class='opt-line'><b>C.<\/b> The superficial femoral vein lies postero-medial to the artery<\/div><br><div class='opt-line'><b>D.<\/b> The deep veins of the calf are more prominent with the leg elevated<\/div><br><div class='opt-line'><b>E.<\/b> The popliteal vein is deep to the artery<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 8-10 Mhz is more appropriate for superficial veins<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The SVC is intrathoracic and therefore velocity increases during inspiration<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The deep veins are more prominent with the patient standing, or sitting with the legs dependent<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The popliteal vein is superficial to the artery.<\/div>","due":35},{"section":"Exam 4 › Exam 4 c","front":"<b>Small bowel enema<\/b><br><div class='opt-line'><b>A.<\/b> Maximum normal jejunal calibre is less than 5.5 cm<\/div><br><div class='opt-line'><b>B.<\/b> Proximal ileum calibre is usually less than 4 cm<\/div><br><div class='opt-line'><b>C.<\/b> Distal ileum calibre less than 3.5 cm<\/div><br><div class='opt-line'><b>D.<\/b> 0.5% aqueous solution of Methylcellulose can be helpful<\/div><br><div class='opt-line'><b>E.<\/b> Single contrast gives better detail than double contrast<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The maximum normal jejunal calibre is 4.5 cm<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":36},{"section":"Exam 4 › Exam 4 c","front":"<b>Regarding centering points<\/b><br><div class='opt-line'><b>A.<\/b> AP hips - 2.5 cm above pubic symphysis<\/div><br><div class='opt-line'><b>B.<\/b> AP pelvis - 5 cm above pubic symphysis<\/div><br><div class='opt-line'><b>C.<\/b> Lateral ankle - 2.5 cm above medial malleolus<\/div><br><div class='opt-line'><b>D.<\/b> AP ankle - midway between medial and lateral malleolus<\/div><br><div class='opt-line'><b>E.<\/b> AP foot - midway of 3rd metatarsal shaft<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; AP view of the ankle is the medial malleolus<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; at middle cunieform<\/div>","due":36},{"section":"Exam 4 › Exam 4 c","front":"<b>Bronchography<\/b><br><div class='opt-line'><b>A.<\/b> A lateral view of the left lung is performed<\/div><br><div class='opt-line'><b>B.<\/b> A frontal view of the right lung is performed<\/div><br><div class='opt-line'><b>C.<\/b> An oblique view of the right lung is performed<\/div><br><div class='opt-line'><b>D.<\/b> The right lung should be imaged before the left<\/div><br><div class='opt-line'><b>E.<\/b> Spot views are not taken routinely<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; LAO or RPO views are performed of the left lung<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; TRUE lateral of the right is performed<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Spot views are sometimes used in bronchography.<\/div>","due":36},{"section":"Exam 4 › Exam 4 c","front":"<b>The following are true of endoscopic retrograde cholangiopancreatography<\/b><br><div class='opt-line'><b>A.<\/b> Retrograde cholangiography is easier than pancreatography<\/div><br><div class='opt-line'><b>B.<\/b> A side-viewing endoscope is required<\/div><br><div class='opt-line'><b>C.<\/b> Pancreatic pseudocysts are a contraindication<\/div><br><div class='opt-line'><b>D.<\/b> The &quot;trickle&quot; artefact is seen on removing the cannula<\/div><br><div class='opt-line'><b>E.<\/b> The presence of oesophageal varices is a contraindication<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Pancreatography is easier than retrograde cholangiography.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The trickle artefact is produced during the injection of contrast into a dilated biliary tree<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":45},{"section":"Exam 5 › Exam 5 b","front":"<b>Regarding ossification times<\/b><br><div class='opt-line'><b>A.<\/b> The radial head is fused at 17 years<\/div><br><div class='opt-line'><b>B.<\/b> The distal ulnar epiphysis is present at birth<\/div><br><div class='opt-line'><b>C.<\/b> None of the carpal bones are ossified at birth<\/div><br><div class='opt-line'><b>D.<\/b> The centre for the trochlea appears at 10 years<\/div><br><div class='opt-line'><b>E.<\/b> The scaphoid is the first carpal bone to ossify<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The distal ulnar epiphysis appears at about 5-6 years.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The capitate is the first carpal bone to ossify.<\/div>","due":30},{"section":"Exam 5 › Exam 5 b","front":"<b>The following are true of upper limb veins<\/b><br><div class='opt-line'><b>A.<\/b> The cephalic vein runs on the lateral side of the forearm<\/div><br><div class='opt-line'><b>B.<\/b> The basilic vein pierces the clavipectoral fascia to join the axillary vein<\/div><br><div class='opt-line'><b>C.<\/b> The median cubital vein connects the cephalic vein to deep brachial veins<\/div><br><div class='opt-line'><b>D.<\/b> There are usually two venae comitantes following the course of the subclavian artery<\/div><br><div class='opt-line'><b>E.<\/b> The median forearm vein runs along the dorsum of the forearm<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The cephalic vein pierces the clavipectoral fascia to join the axillary vein.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The median cubital vein connects the cephalic to the basilic vein.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Usually a single subclavian vein follows the course of the subclavian artery.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The median forearm vein runs along the ventral aspect of the forearm.<\/div>","due":31},{"section":"Exam 5 › Exam 5 b","front":"<b>The following are supplied by the femoral nerve<\/b><br><div class='opt-line'><b>A.<\/b> Gracilis<\/div><br><div class='opt-line'><b>B.<\/b> Iliacus<\/div><br><div class='opt-line'><b>C.<\/b> Vastus lateralis<\/div><br><div class='opt-line'><b>D.<\/b> Gluteus minimus<\/div><br><div class='opt-line'><b>E.<\/b> Tensor fascia lata<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Gracilis is supplied by the obturator nerve.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Gluteus minimus is supplied by the superior gluteal nerve.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Tensor fascia lata is supplied by the superior gluteal nerve.<\/div>","due":32},{"section":"Exam 5 › Exam 5 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The anterior wall of third ventricle is partly formed by lamina terminalis<\/div><br><div class='opt-line'><b>B.<\/b> The massa intermedia is a grey matter tract<\/div><br><div class='opt-line'><b>C.<\/b> The habenular commissure is anterior to the pineal gland<\/div><br><div class='opt-line'><b>D.<\/b> The foramen of Magendie connects lateral and third ventricles<\/div><br><div class='opt-line'><b>E.<\/b> The third ventricle is a cavity of mesencephalon<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The foramen of Munro connects the lateral and third ventricles.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The third ventricle is a cavity of diencephalon.<\/div>","due":32},{"section":"Exam 5 › Exam 5 b","front":"<b>Regarding the pituitary gland<\/b><br><div class='opt-line'><b>A.<\/b> Its stalk is composed of nerve fibres whose cell bodies are in the third ventricle<\/div><br><div class='opt-line'><b>B.<\/b> The anterior lobe is five times larger than the posterior lobe<\/div><br><div class='opt-line'><b>C.<\/b> The posterior lobe develops from Rathke&#x27;s pouch<\/div><br><div class='opt-line'><b>D.<\/b> Its superior relations are diaphragm sella and optic chiasm<\/div><br><div class='opt-line'><b>E.<\/b> The inter-cavernous sinus does not surround the pituitary gland superiorly<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It is the anterior lobe that develops from Rathke&#x27;s pouch.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 5 › Exam 5 b","front":"<b>The rectum<\/b><br><div class='opt-line'><b>A.<\/b> Is about 20 cm long<\/div><br><div class='opt-line'><b>B.<\/b> Becomes continuous with the sigmoid colon at the level of the third sacral segment<\/div><br><div class='opt-line'><b>C.<\/b> Is not covered with peritoneum<\/div><br><div class='opt-line'><b>D.<\/b> Has four rectal valves (of Houston)<\/div><br><div class='opt-line'><b>E.<\/b> Derives its blood supply from superior, middle and inferior rectal arteries<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The rectum is about 12 cm long.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The upper third of the rectum is covered with peritoneum anteriorly and laterally.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; There are three rectal valves.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 5 › Exam 5 b","front":"<b>Regarding the nasal cavity<\/b><br><div class='opt-line'><b>A.<\/b> The vomer forms the anterosuperior part of the nasal septum<\/div><br><div class='opt-line'><b>B.<\/b> The middle and inferior conchae are part of the ethmoid bone<\/div><br><div class='opt-line'><b>C.<\/b> The floor of the nasal cavity is at a lower level than the floor of the maxillary sinus<\/div><br><div class='opt-line'><b>D.<\/b> The perpendicular plate of the palatine bone contributes to the septum<\/div><br><div class='opt-line'><b>E.<\/b> The sphenoidal sinus is in its roof<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The vomer forms posteroinferior part of the septum.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Only superior and middle conchae are part of the ethmoid bone, however the inferior conchа is a separate bone.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The floor of the maxillary sinus lies at a lower level than the floor of the nasal cavity.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The perpendicular plate of palatine bone contributes to the lateral wall of the nasal cavity.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 5 › Exam 5 b","front":"<b>Regarding the bones of the leg<\/b><br><div class='opt-line'><b>A.<\/b> The attachment of the patellar ligament is part of the tibial epiphysis<\/div><br><div class='opt-line'><b>B.<\/b> The tibial shaft is triangular in cross-section<\/div><br><div class='opt-line'><b>C.<\/b> In children the fibula is proportionally thinner than in adults<\/div><br><div class='opt-line'><b>D.<\/b> The malleolar fossa of the fibula is seen on the antero-medial aspect of the lateral malleolus<\/div><br><div class='opt-line'><b>E.<\/b> The tibia is grooved posteriorly by the tibialis posterior tendon<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The fibula is proportionally thicker in children.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The malleolar fossa is on the postero-medial aspect of the lateral malleolus.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":34},{"section":"Exam 5 › Exam 5 b","front":"<b>The following statements are true regarding the sigmoid colon<\/b><br><div class='opt-line'><b>A.<\/b> It has its own mesentery<\/div><br><div class='opt-line'><b>B.<\/b> Lymphatic drainage is to para-aortic nodes<\/div><br><div class='opt-line'><b>C.<\/b> It usually measures less than 45 cm<\/div><br><div class='opt-line'><b>D.<\/b> There is a change in mucosal pattern between rectum and sigmoid colon<\/div><br><div class='opt-line'><b>E.<\/b> The limbs of the sigmoid mesocolon diverge at the bifurcation of the right common iliac artery<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Lymphatic drainage is to inferior mesenteric nodes.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; There is no change in mucosal pattern between the rectum and sigmoid.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The limbs diverge at the bifurcation of the left common iliac artery.<\/div>","due":34},{"section":"Exam 5 › Exam 5 b","front":"<b>On a CT scan at the level of L1<\/b><br><div class='opt-line'><b>A.<\/b> The body of the pancreas lies on the splenic vein<\/div><br><div class='opt-line'><b>B.<\/b> The inferior vena cava is seen closely related to the caudate lobe of the liver<\/div><br><div class='opt-line'><b>C.<\/b> The superior mesenteric artery leaves the aorta<\/div><br><div class='opt-line'><b>D.<\/b> The right adrenal gland is usually visible<\/div><br><div class='opt-line'><b>E.<\/b> Segment II of the liver is usually visible<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The inferior vena cava is free of the liver at L1.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The right adrenal gland lies higher around T11.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Segment II of the liver is seen between T10 and T11.<\/div>","due":34},{"section":"Exam 5 › Exam 5 b","front":"<b>The left renal vein lies posterior to<\/b><br><div class='opt-line'><b>A.<\/b> Abdominal aorta<\/div><br><div class='opt-line'><b>B.<\/b> Body of pancreas<\/div><br><div class='opt-line'><b>C.<\/b> Third part of duodenum<\/div><br><div class='opt-line'><b>D.<\/b> Superior mesenteric artery<\/div><br><div class='opt-line'><b>E.<\/b> Left renal artery<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The renal vein is anterior to the abdominal aorta.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The renal vein is superior to the third part of the duodenum.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The renal vein is anterior to the left renal artery.<\/div>","due":34},{"section":"Exam 5 › Exam 5 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The arachnoid mater is thickened laterally between the nerve roots as the denticulate ligament<\/div><br><div class='opt-line'><b>B.<\/b> The dural or thecal sac extends up to the S2 vertebral level<\/div><br><div class='opt-line'><b>C.<\/b> The posterior spinal arteries supply two thirds of the cross sectional area of the spinal cord<\/div><br><div class='opt-line'><b>D.<\/b> The posterior spinal arteries arise more commonly from the posterior inferior cerebellar branches rather than vertebral arteries<\/div><br><div class='opt-line'><b>E.<\/b> The artery radicularis magna or the artery of Adamkiewicz commonly arises from the left side<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The denticulate ligament arises from pia mater.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Two thirds of the cross sectional area of the spinal cord is supplied by the single anterior spinal artery.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":34},{"section":"Exam 5 › Exam 5 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The left atrium is the most posterior chamber in the heart<\/div><br><div class='opt-line'><b>B.<\/b> The tricuspid and mitral valves are roughly vertically orientated<\/div><br><div class='opt-line'><b>C.<\/b> The normal pericardial sac contains 50 mls of serous fluid<\/div><br><div class='opt-line'><b>D.<\/b> The visceral layer of the pericardium is also known as the epicardium<\/div><br><div class='opt-line'><b>E.<\/b> The pericardium extends on to the SVC up to azygous vein insertion<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The pericardial sac normally contains 20-25 mls only.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":34},{"section":"Exam 5 › Exam 5 b","front":"<b>Regarding the inner ear<\/b><br><div class='opt-line'><b>A.<\/b> The bony labyrinth comprises of cochlea, vestibule and the semicircular canals<\/div><br><div class='opt-line'><b>B.<\/b> The cochlea is situated posterior to the vestibule<\/div><br><div class='opt-line'><b>C.<\/b> The lateral wall of vestibule opens into the middle ear at the round and oval window<\/div><br><div class='opt-line'><b>D.<\/b> There are six openings into the vestibule via the three semicircular canals<\/div><br><div class='opt-line'><b>E.<\/b> The saccule lies in the cochlea and the utricle lies in the vestibule<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The cochlea lies anterior to the vestibule.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; There are only five openings into the vestibules via three semicircular canals.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Both saccule and utricle lie within the vestibule.<\/div>","due":34},{"section":"Exam 5 › Exam 5 b","front":"<b>The appendix<\/b><br><div class='opt-line'><b>A.<\/b> Commonly opens into the posteromedial wall of the cecum<\/div><br><div class='opt-line'><b>B.<\/b> Is supplied by a branch of the inferior mesenteric artery<\/div><br><div class='opt-line'><b>C.<\/b> Has its own mesentery<\/div><br><div class='opt-line'><b>D.<\/b> Commonly measures less than 3 cm in length<\/div><br><div class='opt-line'><b>E.<\/b> Has a collateral arterial supply<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The appendix is supplied by the iliocolic artery from the superior mesenteric artery.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The appendix normally measures 6-9 cm in length.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The appendicular artery is an end artery.<\/div>","due":36},{"section":"Exam 5 › Exam 5 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The internal thoracic artery ends at the sixth intercostal space<\/div><br><div class='opt-line'><b>B.<\/b> At the origin of internal thoracic artery it is crossed by the phrenic nerve<\/div><br><div class='opt-line'><b>C.<\/b> The internal thoracic artery divides into musculophrenic and subcostal arteries<\/div><br><div class='opt-line'><b>D.<\/b> There are two anterior and one posterior intercostal vein for each intercostal space<\/div><br><div class='opt-line'><b>E.<\/b> The internal thoracic artery gives anterior intercostal artery to upper six spaces<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The internal thoracic artery divides into musculophrenic and superior epigastric artery.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":36},{"section":"Exam 5 › Exam 5 b","front":"<b>The following are true<\/b><br><div class='opt-line'><b>A.<\/b> The upper one third of oesophagus is supplied by the inferior thyroid artery<\/div><br><div class='opt-line'><b>B.<\/b> The lower one third of oesophagus is supplied by the descending aorta<\/div><br><div class='opt-line'><b>C.<\/b> The oesophagus has striated muscle in its upper one third<\/div><br><div class='opt-line'><b>D.<\/b> The venous drainage of middle one third of oesophagus is to the azygous system<\/div><br><div class='opt-line'><b>E.<\/b> The venous drainage of lower one third of oesophagus is to the left gastric vein<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Lower one third is supplied by left gastric artery.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":44},{"section":"Exam 5 › Exam 5 b","front":"<b>Regarding the cranial venous sinuses<\/b><br><div class='opt-line'><b>A.<\/b> The superior sagittal sinus usually joins the left transverse sinus<\/div><br><div class='opt-line'><b>B.<\/b> The inferior sagittal sinus joins the right transverse sinus<\/div><br><div class='opt-line'><b>C.<\/b> The straight sinus usually joins the left transverse sinus<\/div><br><div class='opt-line'><b>D.<\/b> The two transverse sinuses often communicate at the internal occipital protuberance<\/div><br><div class='opt-line'><b>E.<\/b> The cavernous sinus is traversed by the internal carotid artery<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The superior sagittal sinus usually joins the right transverse sinus.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The inferior sagittal sinus joins the straight sinus.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":44},{"section":"Exam 5 › Exam 5 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The minor fissure is 1cm below the hilar point<\/div><br><div class='opt-line'><b>B.<\/b> The normal hilar angle at the hilar point is 120 degrees<\/div><br><div class='opt-line'><b>C.<\/b> The cricopharyngeal impression is seen in 5% of normal studies<\/div><br><div class='opt-line'><b>D.<\/b> The right paraspinal line is thicker than the left side<\/div><br><div class='opt-line'><b>E.<\/b> The pulmonary veins in the first intercostal space are up to 3mm in size<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The right paraspinal line is less than 2mm whereas the left can be up to 10mm.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":44},{"section":"Exam 5 › Exam 5 b","front":"<b>Anterior relations of the right kidney include<\/b><br><div class='opt-line'><b>A.<\/b> Quadrate lobe of liver<\/div><br><div class='opt-line'><b>B.<\/b> Duodenum<\/div><br><div class='opt-line'><b>C.<\/b> Ascending colon<\/div><br><div class='opt-line'><b>D.<\/b> Ascending branch of right colic artery<\/div><br><div class='opt-line'><b>E.<\/b> Segment II of the liver<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The quadrate lobe lies more medial in relation to the right kidney.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Segment II is part of the left lobe of the liver.<\/div>","due":45},{"section":"Exam 5 › Exam 5 c","front":"<b>Regarding venography<\/b><br><div class='opt-line'><b>A.<\/b> AP and oblique views of the saphenofemoral junction are required during peripheral varicography<\/div><br><div class='opt-line'><b>B.<\/b> A rapid injection of 30 mls into a medial anterior cubital fossa vein will adequately opacify the superior vena cava<\/div><br><div class='opt-line'><b>C.<\/b> Clot dislodgement commonly causes PE during venography<\/div><br><div class='opt-line'><b>D.<\/b> MRI can be used to age venous thrombus<\/div><br><div class='opt-line'><b>E.<\/b> Bilateral femoral vein puncture is required to image the inferior vena cava<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; To opacify the SVC simultaneous injection into both arms is required.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Clot dislodgement causing venous thrombosis is rarely reported.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":30},{"section":"Exam 5 › Exam 5 c","front":"<b>The following are true regarding a Towne&#x27;s view of the skull (30 degrees fronto-occipital)<\/b><br><div class='opt-line'><b>A.<\/b> The radiographic baseline is at 90 degrees to the cassette<\/div><br><div class='opt-line'><b>B.<\/b> Tube angulation is in the cranial direction<\/div><br><div class='opt-line'><b>C.<\/b> The dorsum sellae is projected through the foramen magnum<\/div><br><div class='opt-line'><b>D.<\/b> The zygomatic arches are not visible<\/div><br><div class='opt-line'><b>E.<\/b> The coronal suture is not visible<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span><\/div>","due":30},{"section":"Exam 5 › Exam 5 c","front":"<b>Regarding endoscopic retrograde cholangiopancreatography<\/b><br><div class='opt-line'><b>A.<\/b> A prolonged prothrombin time is a contraindication<\/div><br><div class='opt-line'><b>B.<\/b> Duodenal hypotension aids papilla cannulation<\/div><br><div class='opt-line'><b>C.<\/b> The procedure is more prone to technical failure than percutaneous transhepatic cholangiography<\/div><br><div class='opt-line'><b>D.<\/b> The pancreatic tree should be visualized before the biliary tree<\/div><br><div class='opt-line'><b>E.<\/b> Aspiration pneumonitis is a complication<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A prolonged prothrombin time is not a contraindication.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":30},{"section":"Exam 5 › Exam 5 c","front":"<b>Properties of Barium enema suspension<\/b><br><div class='opt-line'><b>A.<\/b> Particle size is large approximately 4.5 micrometers<\/div><br><div class='opt-line'><b>B.<\/b> Particles are coated with agents<\/div><br><div class='opt-line'><b>C.<\/b> Slow flow is preferable<\/div><br><div class='opt-line'><b>D.<\/b> The suspension should provide plastic coating characteristics<\/div><br><div class='opt-line'><b>E.<\/b> Should contain antifoaming agents<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The Barium particles used for an enema are small particles (0.6-1.4 µm) and are coated to provide certain characteristics such as plasticity and rapid flow.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Without antifoaming agents it cracks.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":30},{"section":"Exam 5 › Exam 5 c","front":"<b>CT Pulmonary Angiogram<\/b><br><div class='opt-line'><b>A.<\/b> Requires 70 mls non-ionic contrast media<\/div><br><div class='opt-line'><b>B.<\/b> A pump injection of 2 mls per second is used<\/div><br><div class='opt-line'><b>C.<\/b> The scan should start at the level of the arch of the aorta<\/div><br><div class='opt-line'><b>D.<\/b> High resolution algorithm is required<\/div><br><div class='opt-line'><b>E.<\/b> A HRCT scan should be performed first<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 100-150 mls of non-ionic contrast media is required for an average adult.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Injected at a rate of 3-5 mls per second.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The scan starts below the level of the left atrium and moves cephalad.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A high resolution algorithm is only used for HRCT.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span> &mdash; HRCT is recommended nowadays prior to the angiogram as this can look for other causes for the patient&#x27;s shortness of breath.<\/div>","due":30},{"section":"Exam 5 › Exam 5 c","front":"<b>Mag-3 renograms<\/b><br><div class='opt-line'><b>A.<\/b> Can be used to demonstrate renal scarring following infection<\/div><br><div class='opt-line'><b>B.<\/b> Allows estimation of the glomerular filtration rate<\/div><br><div class='opt-line'><b>C.<\/b> Mag-3 is 80% passively filtered at the glomerulus<\/div><br><div class='opt-line'><b>D.<\/b> A bolus of intravenous frusemide at 10 minutes allows differentiation between a dilated non-obstructed system and an obstructed one<\/div><br><div class='opt-line'><b>E.<\/b> Images are required at 20-30 minutes following isotope injection<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span> &mdash; Scarring will be detected with a Mag-3 renogram if renal function is good.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It allows assessment of divided renal function.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 80% is actively secreted by proximal convoluted tubal, whilst 20% is filtered.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Images are required from 0-30 minutes.<\/div>","due":31},{"section":"Exam 5 › Exam 5 c","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> Cooper&#x27;s ligaments are invisible on ultrasound of the breast<\/div><br><div class='opt-line'><b>B.<\/b> During Doppler venography, the Valsalva maneuver does not transmit below the knee<\/div><br><div class='opt-line'><b>C.<\/b> The paramedial lobe of the thyroid arises from the superior aspect of the isthmus<\/div><br><div class='opt-line'><b>D.<\/b> An intervening loop of bowel is an absolute contraindication to fine needle aspiration<\/div><br><div class='opt-line'><b>E.<\/b> The upper limit for normal for AP diameter of the aorta in a 60-year-old is 2.5 cm<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":31},{"section":"Exam 5 › Exam 5 c","front":"<b>Regarding liver scintigraphy<\/b><br><div class='opt-line'><b>A.<\/b> Planar imaging can detect lesions 2 cm in size<\/div><br><div class='opt-line'><b>B.<\/b> SPECT can detect lesions 5 mm in size<\/div><br><div class='opt-line'><b>C.<\/b> The normal liver is visualized before the spleen<\/div><br><div class='opt-line'><b>D.<\/b> Is indicated in the diagnosis of renal transplant rejection<\/div><br><div class='opt-line'><b>E.<\/b> Colloid shift is the abnormal redistribution of isotope into the biliary tree<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The spleen is visualized during the arterial phase, while the liver is mainly visualized during the portal venous phase.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Colloid shift is the increased distribution of isotope to the spleen and bone marrow indicating diffuse liver disease or portal hypertension.<\/div>","due":31},{"section":"Exam 5 › Exam 5 c","front":"<b>Ultrasound of oesophagus<\/b><br><div class='opt-line'><b>A.<\/b> A 5 MHz transducer is used<\/div><br><div class='opt-line'><b>B.<\/b> A 90 degree rotatory transducer is required<\/div><br><div class='opt-line'><b>C.<\/b> Stomach filled with warm tap water<\/div><br><div class='opt-line'><b>D.<\/b> Rotatory transducer provides excellent transverse views of the esophagus<\/div><br><div class='opt-line'><b>E.<\/b> Should be monitored with pulse oximeter<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A 7.5-10 MHz transducer is required which can be rotated through 360 degrees.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The stomach should be filled with de-aerated water.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":31},{"section":"Exam 5 › Exam 5 c","front":"<b>Patient preparation for angiography includes<\/b><br><div class='opt-line'><b>A.<\/b> Premedication<\/div><br><div class='opt-line'><b>B.<\/b> Written consent<\/div><br><div class='opt-line'><b>C.<\/b> Blood glucose assessment<\/div><br><div class='opt-line'><b>D.<\/b> ECG monitoring<\/div><br><div class='opt-line'><b>E.<\/b> Nil by mouth for 4 hours<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Blood glucose levels should be checked in diabetics.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; ECG monitoring is only required in patients with cardiac disease.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; No solids should be taken but fluids encouraged up to 2 hours before to avoid dehydration.<\/div>","due":31},{"section":"Exam 5 › Exam 5 c","front":"<b>Routine MRI of ankle sequences include<\/b><br><div class='opt-line'><b>A.<\/b> Coronal T1<\/div><br><div class='opt-line'><b>B.<\/b> Coronal STIR<\/div><br><div class='opt-line'><b>C.<\/b> Sagittal GE<\/div><br><div class='opt-line'><b>D.<\/b> Axial T1<\/div><br><div class='opt-line'><b>E.<\/b> Coronal T2<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span> &mdash; Either GE to look at the talar dome or STIR to look for bone marrow signal changes.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span><\/div>","due":31},{"section":"Exam 5 › Exam 5 c","front":"<b>The half-life of the following radioisotopes are appropriate<\/b><br><div class='opt-line'><b>A.<\/b> Krypton-30 sec<\/div><br><div class='opt-line'><b>B.<\/b> Xenon-5.25 days<\/div><br><div class='opt-line'><b>C.<\/b> Xenon-2 weeks<\/div><br><div class='opt-line'><b>D.<\/b> 113Indium-30 seconds<\/div><br><div class='opt-line'><b>E.<\/b> Indium-2.8 days<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The half time for sim Krypton is 13 seconds.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":31},{"section":"Exam 5 › Exam 5 c","front":"<b>The following centering points are correct<\/b><br><div class='opt-line'><b>A.<\/b> Axial elbow-5cm distal to the olecranon<\/div><br><div class='opt-line'><b>B.<\/b> AP shoulder- head of humerus<\/div><br><div class='opt-line'><b>C.<\/b> Lateral toes- midshaft of 1st metatarsal<\/div><br><div class='opt-line'><b>D.<\/b> Lateral foot- base of fifth metatarsal<\/div><br><div class='opt-line'><b>E.<\/b> Lateral view of the calcaneus- middle of calcaneus<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; AP shoulder- coracoid process<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Lateral toes head of 1st metatarsal<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Lateral foot- cubonavicular joint<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Lateral view of the calcaneus- talocalcaneal joint<\/div>","due":31},{"section":"Exam 5 › Exam 5 c","front":"<b>Regarding Discography<\/b><br><div class='opt-line'><b>A.<\/b> Prophylactic antibiotics are indicated<\/div><br><div class='opt-line'><b>B.<\/b> The patient should be well sedated<\/div><br><div class='opt-line'><b>C.<\/b> Discography of a normal disc is painless<\/div><br><div class='opt-line'><b>D.<\/b> 2 mls non-ionic contrast media are injected into the nucleus pulposus<\/div><br><div class='opt-line'><b>E.<\/b> Retroperitoneal haemorrhage is a recognised complication<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The patient needs to be fully conscious in order to describe pain.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 0.5-1 ml of non-ionic contrast media is introduced into the nucleus pulposus, often followed by 0.2-0.3 ml of bupacaine.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span> &mdash; If the needle passes too anteriorly a major vessel can be punctured and cause retroperitoneal haemorrhage.<\/div>","due":33},{"section":"Exam 5 › Exam 5 c","front":"<b>Regarding gestational dating with ultrasound<\/b><br><div class='opt-line'><b>A.<\/b> Head circumference measurements are less accurate than the biparietal diameter<\/div><br><div class='opt-line'><b>B.<\/b> Biparietal diameter is most reliable in the third trimester<\/div><br><div class='opt-line'><b>C.<\/b> Crown rump length is most reliable in the first trimester<\/div><br><div class='opt-line'><b>D.<\/b> The yolk sac is reliably detected by transvaginal ultrasound at four weeks gestation<\/div><br><div class='opt-line'><b>E.<\/b> The heart beat is not reliably detected before 6.5 weeks on transabdominal ultrasound<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; BPD is most reliable in the second trimester.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The yolk sac is reliably detected by TVS at 5.5 weeks.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":34},{"section":"Exam 5 › Exam 5 c","front":"<b>The following are absolute contraindications<\/b><br><div class='opt-line'><b>A.<\/b> Barium swallow - esophageal leak into pleura<\/div><br><div class='opt-line'><b>B.<\/b> Barium swallow - aspiration<\/div><br><div class='opt-line'><b>C.<\/b> Gastrograffin - aspiration<\/div><br><div class='opt-line'><b>D.<\/b> Gastromiro - aspiration<\/div><br><div class='opt-line'><b>E.<\/b> Barium swallow - peritoneal leak<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Following aspiration, barium is usually coughed up but may need physiotherapy.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span> &mdash; Gastrograffin causes a severe chemical pneumonitis.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Gastromiro does not induce a reaction in lung parenchyma.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span> &mdash; Barium in serous cavities causes a marked inflammatory response leading to fibrosis.<\/div>","due":34},{"section":"Exam 5 › Exam 5 c","front":"<b>When imaging the adrenal glands<\/b><br><div class='opt-line'><b>A.<\/b> Ultrasound is the modality of choice in children<\/div><br><div class='opt-line'><b>B.<\/b> The spatial resolution of MRI is greater than CT<\/div><br><div class='opt-line'><b>C.<\/b> Se-cholesterol is predominantly taken up by the adrenal medulla<\/div><br><div class='opt-line'><b>D.<\/b> 21-MIBG is predominantly taken up by the adrenal cortex<\/div><br><div class='opt-line'><b>E.<\/b> 21-MIBG uptake in the lungs is normal<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; CT has greater resolution than MRI.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Se-cholesterol is taken up by the adrenal cortex.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 21-MIBG is taken up by the adrenal medulla and is used to demonstrate pheochromocytomas.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":36},{"section":"Exam 5 › Exam 5 c","front":"<b>Barium Swallow - Double contrast<\/b><br><div class='opt-line'><b>A.<\/b> Views of the stomach are mandatory<\/div><br><div class='opt-line'><b>B.<\/b> Views of the upper oesophagus are mandatory<\/div><br><div class='opt-line'><b>C.<\/b> Turn patient to left side to look for reflux<\/div><br><div class='opt-line'><b>D.<\/b> AP views mandatory<\/div><br><div class='opt-line'><b>E.<\/b> Lateral view is mandatory<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The upper oesophagus should only be imaged if symptoms suggest an upper oesophagus lesion.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; To look for reflux turn patient from left side to right side.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The mandatory projections are RAO or LAO erect and prone LPO.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span><\/div>","due":44},{"section":"Exam 5 › Exam 5 c","front":"<b>The angiographic unit must have<\/b><br><div class='opt-line'><b>A.<\/b> A high speed rotating cathode<\/div><br><div class='opt-line'><b>B.<\/b> Focal spot of 0.1-0.2 mm sq<\/div><br><div class='opt-line'><b>C.<\/b> Floating table top<\/div><br><div class='opt-line'><b>D.<\/b> Biplane unit<\/div><br><div class='opt-line'><b>E.<\/b> Tilting table top<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A high speed rotation anode and a focal spot of 0.3-1.2 mm sq. are required.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; This is usually added on to a multipurpose digital unit nowadays.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A tilting table top is desirable but most dedicated vascular suites do not have this facility.<\/div>","due":44},{"section":"Exam 5 › Exam 5 c","front":"<b>Regarding hip Arthrography<\/b><br><div class='opt-line'><b>A.<\/b> 6-10 mls of contrast is introduced in an adult<\/div><br><div class='opt-line'><b>B.<\/b> 6-10 mls air is introduced in an adult<\/div><br><div class='opt-line'><b>C.<\/b> Lateral approach routine<\/div><br><div class='opt-line'><b>D.<\/b> Active movement<\/div><br><div class='opt-line'><b>E.<\/b> Frog&#x27;s view for children helpful<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 3-5 mls of contrast are injected (children 1-2 mls).<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Hip arthrography is a single contrast study.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; An anterior approach is standard.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The joint is observed under passive movement.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":44},{"section":"Exam 6 › Exam 6 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The normal atlanto-axial distance in a child is 5mm<\/div><br><div class='opt-line'><b>B.<\/b> The normal mandibular angle is 110 degrees in an adult<\/div><br><div class='opt-line'><b>C.<\/b> The third ventricle measures up to 7mm across in a coronal plane<\/div><br><div class='opt-line'><b>D.<\/b> The lowest foramen transversarium containing the vertebral artery at C5 is seen in 5% of cases<\/div><br><div class='opt-line'><b>E.<\/b> Hyperostosis frontalis interna is 10 times more common in women<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":31},{"section":"Exam 6 › Exam 6 b","front":"<b>The following are true<\/b><br><div class='opt-line'><b>A.<\/b> The cisterna chyli lies in front of the
