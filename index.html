D.<\/b> The splenic artery arises directly from the aorta in 0.5% of cases<\/div><br><div class='opt-line'><b>E.<\/b> The left renal vein is retro-aortic in 10% of cases<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The right hepatic artery arises from the SMA in 10%<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The left renal vein is retroaortic in 3.5%<\/div>","due":32},{"section":"Exam 6 › Exam 6 b","front":"<b>The following are true regarding fascia of the neck<\/b><br><div class='opt-line'><b>A.<\/b> The platysma is contained within the deep fascia of the neck<\/div><br><div class='opt-line'><b>B.<\/b> The pre-tracheal fascia is contained in the deep fascia<\/div><br><div class='opt-line'><b>C.<\/b> The cervical fascia encloses the sternocleidomastoid and trapezius muscles<\/div><br><div class='opt-line'><b>D.<\/b> The pre-vertebral fascia lies anterior to the brachial plexus<\/div><br><div class='opt-line'><b>E.<\/b> The carotid sheath encases the internal carotid artery medial to the internal jugular vein<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The platysma is within the superficial fascia.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 6 › Exam 6 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The foramen lacerum is filled with fibrocartilage<\/div><br><div class='opt-line'><b>B.<\/b> The superior orbital fissures lies between greater and lesser wings of sphenoid<\/div><br><div class='opt-line'><b>C.<\/b> The foramen rotundum transmits the maxillary nerve<\/div><br><div class='opt-line'><b>D.<\/b> The foramen ovale is about 1.5cm in front of foramen rotundum<\/div><br><div class='opt-line'><b>E.<\/b> The hypoglossal canal lies posterior to the occipital condyle<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The foramen ovale is 1.5cm behind the foramen rotundum in the greater wing of sphenoid.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The hypoglossal canal lies anterior and above the occipital condyle.<\/div>","due":32},{"section":"Exam 6 › Exam 6 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> Malrotation results in a left-sided pancreas<\/div><br><div class='opt-line'><b>B.<\/b> Pancreatic tissue may completely surround the duodenum<\/div><br><div class='opt-line'><b>C.<\/b> Pancreas divisum occurs when the ventral and dorsal buds fail to fuse<\/div><br><div class='opt-line'><b>D.<\/b> The dorsal bud may fail to develop resulting in a pancreas with a head only<\/div><br><div class='opt-line'><b>E.<\/b> Accessory pancreatic nodules may occur within the stomach wall<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A left-sided pancreas is an effect of laxity of the suspensory fascia.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 6 › Exam 6 b","front":"<b>The following are true:<\/b><br><div class='opt-line'><b>A.<\/b> The optic canal is entirely formed by the great wing of sphenoid.<\/div><br><div class='opt-line'><b>B.<\/b> The ophthalmic artery lies inferior to the optic nerve in the optic canal.<\/div><br><div class='opt-line'><b>C.<\/b> The optic canal transmits the superior ophthalmic vein.<\/div><br><div class='opt-line'><b>D.<\/b> The optic canal connects the orbital apex with the suprasellar cistern.<\/div><br><div class='opt-line'><b>E.<\/b> The intracranial portion of the optic nerve is lateral to the internal carotid artery.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The optic canal is entirely formed by the lesser wing of the sphenoid.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The superior ophthalmic vein is transmitted through the superior orbital fissure.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The intracranial portion of the optic nerve is medial to the internal carotid artery.<\/div>","due":32},{"section":"Exam 6 › Exam 6 b","front":"<b>The male urethra:<\/b><br><div class='opt-line'><b>A.<\/b> Has a penile portion approximately 15 cm long.<\/div><br><div class='opt-line'><b>B.<\/b> Has a dilated portion called the navicular fossa.<\/div><br><div class='opt-line'><b>C.<\/b> The prostatic portion is the widest portion.<\/div><br><div class='opt-line'><b>D.<\/b> The ejaculatory ducts open in the membranous urethra.<\/div><br><div class='opt-line'><b>E.<\/b> Is partially lined with squamous epithelium.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The ejaculatory ducts open in the prostatic urethra.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 6 › Exam 6 b","front":"<b>The following statements are true:<\/b><br><div class='opt-line'><b>A.<\/b> The normal thickness of the pericardium is 4-5mm.<\/div><br><div class='opt-line'><b>B.<\/b> The transverse sinus lies anterior to the ascending aorta.<\/div><br><div class='opt-line'><b>C.<\/b> The fat present between the epicardium and myocardium increases with age.<\/div><br><div class='opt-line'><b>D.<\/b> The pericardium receives its blood supply from branches of the pulmonary arteries.<\/div><br><div class='opt-line'><b>E.<\/b> Blood from the pericardium is drained to the azygous system.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The normal thickness of the pericardium is 1-2mm only.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The transverse sinus lies behind the ascending aorta.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The pericardium receives its blood supply from branches of the internal mammary artery.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 6 › Exam 6 b","front":"<b>At the shoulder<\/b><br><div class='opt-line'><b>A.<\/b> The axillary vein lies lateral to the axillary artery<\/div><br><div class='opt-line'><b>B.<\/b> The glenoid labrum is deficient inferiorly<\/div><br><div class='opt-line'><b>C.<\/b> Subscapular muscle inserts into the lesser tuberosity of the humerus<\/div><br><div class='opt-line'><b>D.<\/b> The anterior circumflex humeral artery arises from the third part of the axillary artery<\/div><br><div class='opt-line'><b>E.<\/b> The acromioclavicular joint is a typical synovial joint<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The axillary vein lies medial to the axillary artery.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The glenoid labrum is a continuous ring.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The acromioclavicular joint is an atypical synovial joint.<\/div>","due":33},{"section":"Exam 6 › Exam 6 c","front":"<b>The following statements are true regarding hysterosalpingograms:<\/b><br><div class='opt-line'><b>A.<\/b> Prophylactic pain control is routine.<\/div><br><div class='opt-line'><b>B.<\/b> Pethidine is an appropriate analgesic.<\/div><br><div class='opt-line'><b>C.<\/b> A full bladder can cause pseudo-obstruction of the fallopian tubes.<\/div><br><div class='opt-line'><b>D.<\/b> Approximately 10 mL of warmed water-soluble contrast media is introduced into the uterine cavity.<\/div><br><div class='opt-line'><b>E.<\/b> Cervical manipulation can induce syncope.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Pethidine causes smooth muscle relaxation and delays delineation of fallopian tubes.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":31},{"section":"Exam 6 › Exam 6 c","front":"<b>The following statements are true regarding bowel preparation for a barium enema:<\/b><br><div class='opt-line'><b>A.<\/b> Bisacodyl.<\/div><br><div class='opt-line'><b>B.<\/b> Castor oil.<\/div><br><div class='opt-line'><b>C.<\/b> Calcium citrate.<\/div><br><div class='opt-line'><b>D.<\/b> Sodium picosulphate.<\/div><br><div class='opt-line'><b>E.<\/b> Magnesium oxide citrate.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":31},{"section":"Exam 6 › Exam 6 c","front":"<b>The following statements are true regarding infusion rates of contrast during angiography:<\/b><br><div class='opt-line'><b>A.<\/b> Aorta and legs - 10 mL per second.<\/div><br><div class='opt-line'><b>B.<\/b> Coeliac axis angiography - 6-8 mL per second.<\/div><br><div class='opt-line'><b>C.<\/b> Selective renal angiography - 6-10 mL per second.<\/div><br><div class='opt-line'><b>D.<\/b> IMA angiography - 5 mL per second.<\/div><br><div class='opt-line'><b>E.<\/b> Carotid angiography - 5 mL per second.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Usually performed using a hand injection at 4-5 mL per second.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Usually performed at 3-4 mL per second.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Usually performed at 3-4 mL per second.<\/div>","due":31},{"section":"Exam 6 › Exam 6 c","front":"<b>Angiographic unit staff must:<\/b><br><div class='opt-line'><b>A.<\/b> Wear lead aprons with lead equivalent to 0.25-0.5 mm.<\/div><br><div class='opt-line'><b>B.<\/b> Wear a whole-body radiation dose monitor.<\/div><br><div class='opt-line'><b>C.<\/b> Wear a peripheral radiation dose monitor.<\/div><br><div class='opt-line'><b>D.<\/b> Be immunised against hep B virus.<\/div><br><div class='opt-line'><b>E.<\/b> Wear a thyroid shield.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Peripheral radiation dose monitors and thyroid shields are optional.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Thyroid shields are optional.<\/div>","due":31},{"section":"Exam 6 › Exam 6 c","front":"<b>Echogenicity - Liver, Spleen, Kidney Regarding ultrasound of the upper abdomen:<\/b><br><div class='opt-line'><b>A.<\/b> The spleen is more echogenic than the liver in adults.<\/div><br><div class='opt-line'><b>B.<\/b> The spleen is more echogenic than the renal cortex in adults.<\/div><br><div class='opt-line'><b>C.<\/b> The renal sinus is more prominent in a neonate than an adult.<\/div><br><div class='opt-line'><b>D.<\/b> The renal cortex is more echogenic than the spleen in a neonate.<\/div><br><div class='opt-line'><b>E.<\/b> The renal cortex is more echogenic than the renal sinus in adults.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The liver is more echogenic than the spleen.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The renal sinus is less prominent in neonates.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The renal sinus is more echogenic.<\/div>","due":31},{"section":"Exam 6 › Exam 6 c","front":"<b>The following values are appropriate:<\/b><br><div class='opt-line'><b>A.<\/b> Krypton - 190 KeV 13 Sec.<\/div><br><div class='opt-line'><b>B.<\/b> Xenon 171 KeV.<\/div><br><div class='opt-line'><b>C.<\/b> 127Xenon - 172 KeV.<\/div><br><div class='opt-line'><b>D.<\/b> 127Xenon - 390 KeV.<\/div><br><div class='opt-line'><b>E.<\/b> 127Xenon - 203 KeV.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Xenon emits 81 KeV, 171 KeV is Indium.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Xenon emits at three energies: 172, 203, and 375 KeV.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":31},{"section":"Exam 6 › Exam 6 c","front":"<b>In dental radiography:<\/b><br><div class='opt-line'><b>A.<\/b> The deciduous teeth should all be present by 2.5 years.<\/div><br><div class='opt-line'><b>B.<\/b> The upper permanent teeth erupt 6-12 months prior to the lower.<\/div><br><div class='opt-line'><b>C.<\/b> The normal adult has 8 permanent premolars and 12 permanent molars.<\/div><br><div class='opt-line'><b>D.<\/b> There are normally 8 deciduous premolar teeth.<\/div><br><div class='opt-line'><b>E.<\/b> Tooth enamel is the most radio-opaque tissue in the body.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The lower permanent teeth erupt 6- 12 months earlier than the upper.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; There are no deciduous premolar teeth.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":31},{"section":"Exam 6 › Exam 6 c","front":"<b>The following are true of transcranial ultrasound:<\/b><br><div class='opt-line'><b>A.<\/b> The choroid plexus is echogenic.<\/div><br><div class='opt-line'><b>B.<\/b> The corpus callosum is best identified on the sagittal oblique views.<\/div><br><div class='opt-line'><b>C.<\/b> The choroid plexus is found in the lateral ventricles anterior to the caudothalamic notch.<\/div><br><div class='opt-line'><b>D.<\/b> The cerebellar tonsils are not well demonstrated.<\/div><br><div class='opt-line'><b>E.<\/b> A cavum septum pellucidum is a normal variant.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It is best identified on midline sagittal views.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The normal choroid plexus does not extend anterior to the caudothalamic notch.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":31},{"section":"Exam 6 › Exam 6 c","front":"<b>The following statements are true regarding percutaneous extraction of retained biliary calculi:<\/b><br><div class='opt-line'><b>A.<\/b> Must be performed within one month of a T-tube cholangiogram.<\/div><br><div class='opt-line'><b>B.<\/b> Has higher morbidity and mortality rates than endoscopic sphincterotomy.<\/div><br><div class='opt-line'><b>C.<\/b> Is performed via the T-tube.<\/div><br><div class='opt-line'><b>D.<\/b> Repeated attempts over several weeks may be required.<\/div><br><div class='opt-line'><b>E.<\/b> Prophylactic antibiotics are required.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Percutaneous extraction should not be performed before at least one month.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It has lower morbidity and mortality than sphincterotomy.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The T-tube is removed, and the procedure is performed via the fistulous tract.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 6 › Exam 6 c","front":"<b>The following tube angulations are correct:<\/b><br><div class='opt-line'><b>A.<\/b> Axial view of calcaneus - 30 degrees of cranial angulation.<\/div><br><div class='opt-line'><b>B.<\/b> Tunnel view of the knee - 110-degree angulation to the shaft of the tibia.<\/div><br><div class='opt-line'><b>C.<\/b> Tunnel view of the knee - 90-degree angulation to the shaft of the tibia.<\/div><br><div class='opt-line'><b>D.<\/b> AP cervical spine - 5 degrees cephalad.<\/div><br><div class='opt-line'><b>E.<\/b> Submentovertex - 5 degrees cephalad.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; AP cervical spine requires 15 degrees cephalad angulation.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 6 › Exam 6 c","front":"<b>The following statements are true regarding ultrasound of the pylorus in infants:<\/b><br><div class='opt-line'><b>A.<\/b> Muscle is hypoechoic.<\/div><br><div class='opt-line'><b>B.<\/b> Mucosa is hyperechoic.<\/div><br><div class='opt-line'><b>C.<\/b> The pyloric canal should be measured.<\/div><br><div class='opt-line'><b>D.<\/b> A muscle thickness greater than 3 mm is abnormal.<\/div><br><div class='opt-line'><b>E.<\/b> Pyloric volume is the best parameter.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A thickness greater than 5 mm is abnormal; 3-5 mm is equivocal.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; No universal agreement on the best parameter.<\/div>","due":32},{"section":"Exam 6 › Exam 6 c","front":"<b>The following statements are true regarding gestational dating:<\/b><br><div class='opt-line'><b>A.<\/b> Spinal flexion may produce falsely low crown-rump length values towards the end of the first trimester.<\/div><br><div class='opt-line'><b>B.<\/b> The biparietal diameter is performed by measuring leading edge to leading edge of the skull vault.<\/div><br><div class='opt-line'><b>C.<\/b> A transverse scan at the widest part of the skull demonstrates both thalami and the cavum septum pellucidum.<\/div><br><div class='opt-line'><b>D.<\/b> The ratio of head circumference to abdominal circumference gives an accurate assessment of gestational age in the second trimester.<\/div><br><div class='opt-line'><b>E.<\/b> The hyperechoic distal femoral point should be included in measurements of femur length.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; This ratio correlates well with intrauterine growth in the third trimester.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Including it leads to artefactual lengthening.<\/div>","due":32},{"section":"Exam 6 › Exam 6 c","front":"<b>The following statements are true regarding lung biopsy:<\/b><br><div class='opt-line'><b>A.<\/b> Is complicated by pneumothorax in 50%.<\/div><br><div class='opt-line'><b>B.<\/b> The patient should be turned onto the side of biopsy if a pneumothorax develops.<\/div><br><div class='opt-line'><b>C.<\/b> A chest drain is necessary in 10% of pneumothoraces.<\/div><br><div class='opt-line'><b>D.<\/b> Pneumothorax development is more common in the prone position.<\/div><br><div class='opt-line'><b>E.<\/b> Haemoptysis occurs in 1%.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Pneumothorax occurs in 15-35% of cases.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Controversial; the prone position may reduce the number of chest drains needed.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Haemoptysis occurs in 2-5% of cases.<\/div>","due":32},{"section":"Exam 6 › Exam 6 c","front":"<b>When performing a peroperative cholangiogram:<\/b><br><div class='opt-line'><b>A.<\/b> 20 mLs of 300 mg/mL water-soluble contrast media should be used.<\/div><br><div class='opt-line'><b>B.<\/b> The common bile duct should not exceed 8 mm in diameter.<\/div><br><div class='opt-line'><b>C.<\/b> Glucagon causes relaxation of the Sphincter of Oddi.<\/div><br><div class='opt-line'><b>D.<\/b> Free flow of contrast media into the duodenum should be demonstrated.<\/div><br><div class='opt-line'><b>E.<\/b> Retrograde filling of the intra-hepatic ducts is normal.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 150 mg/mL contrast media is used.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The CBD should not exceed 12 mm in diameter.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 6 › Exam 6 c","front":"<b>Shoulder CT Arthrography:<\/b><br><div class='opt-line'><b>A.<\/b> 4-6 mLs contrast is required.<\/div><br><div class='opt-line'><b>B.<\/b> 8-12 mLs of air is required.<\/div><br><div class='opt-line'><b>C.<\/b> Is performed supine.<\/div><br><div class='opt-line'><b>D.<\/b> Scanning should be performed in arrested respiration.<\/div><br><div class='opt-line'><b>E.<\/b> 3 cm contiguous scans.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 1-3 mLs of contrast is required.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 4-8 mLs of air is required.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 6 › Exam 6 c","front":"<b>The following are used in Isotope small bowel studies:<\/b><br><div class='opt-line'><b>A.<\/b> Tc sulphur colloid.<\/div><br><div class='opt-line'><b>B.<\/b> Tc pertechnetate.<\/div><br><div class='opt-line'><b>C.<\/b> RBC labelled with Tc.<\/div><br><div class='opt-line'><b>D.<\/b> Tc- labelled albumin.<\/div><br><div class='opt-line'><b>E.<\/b> Indium labelled leucocytes.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Labelled red blood cells are used for detecting bleeding.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 6 › Exam 6 c","front":"<b>Regarding routine MRI of the hip:<\/b><br><div class='opt-line'><b>A.<\/b> Both hips are demonstrated on axial images.<\/div><br><div class='opt-line'><b>B.<\/b> Both hips are demonstrated on sagittal images.<\/div><br><div class='opt-line'><b>C.<\/b> Axial GE sequences are used.<\/div><br><div class='opt-line'><b>D.<\/b> Coronal T1 sequences are used.<\/div><br><div class='opt-line'><b>E.<\/b> Coronal STIR sequences are used.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Only the symptomatic hip is demonstrated on the sagittal images.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Axial T1, T2 and/or STIR sequences are usually performed.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 6 › Exam 6 c","front":"<b>The following statements are true of a DMSA renogram:<\/b><br><div class='opt-line'><b>A.<\/b> DMSA allows detection of ectopic renal tissue.<\/div><br><div class='opt-line'><b>B.<\/b> DMSA is excreted by glomerular filtration.<\/div><br><div class='opt-line'><b>C.<\/b> Imaging should be performed immediately 1.5 hr after DMSA injection.<\/div><br><div class='opt-line'><b>D.<\/b> A pelvic kidney is most well demonstrated by a posterior view.<\/div><br><div class='opt-line'><b>E.<\/b> DMSA delivers a higher dose to the patient than Mag-3.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; DMSA is actively secreted by tubules.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Imaging should not be performed before 1.5 hours to allow clearance of free technetium from the urinary tract.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The anterior view is best to demonstrate a pelvic kidney.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 6 › Exam 6 c","front":"<b>The following statements are true regarding dynamic spiral CT of the chest:<\/b><br><div class='opt-line'><b>A.<\/b> Uses a high-resolution algorithm only for HRCT.<\/div><br><div class='opt-line'><b>B.<\/b> Requires 50 mL of non-ionic contrast media.<\/div><br><div class='opt-line'><b>C.<\/b> An injection rate of 5 mL per second is routine.<\/div><br><div class='opt-line'><b>D.<\/b> A pitch of 1 is recommended.<\/div><br><div class='opt-line'><b>E.<\/b> A pitch of 1 represents one spiral scan covering 360 degrees.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; High-resolution algorithms are used for HRCT only.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 100-150 mL is required.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 5 mL per second is for CT pulmonary angiography; 2-3 mL per second is routine.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A pitch of 1.5-2 can be used.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 6 › Exam 6 c","front":"<b>Barium as a contrast medium:<\/b><br><div class='opt-line'><b>A.<\/b> EZM hD is 225 w/v.<\/div><br><div class='opt-line'><b>B.<\/b> EZM hD comes as a suspension.<\/div><br><div class='opt-line'><b>C.<\/b> EZM hD is diluted with 55 mLs of water.<\/div><br><div class='opt-line'><b>D.<\/b> Baritop comes as a suspension.<\/div><br><div class='opt-line'><b>E.<\/b> Barium incites a reaction in the bronchial tree.<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; EZM hD comes as a powder form reconstituted with 60 mLs of water.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; EZM hD comes as a powder form.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; EZM hD is reconstituted with 60 mLs of water.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Barium does not incite a reaction in the bronchial tree.<\/div>","due":34},{"section":"Exam 7 › Exam 7 b","front":"<b>Regarding the cranial nerves<\/b><br><div class='opt-line'><b>A.<\/b> The third cranial nerve has both somatic motor and sensory fibres<\/div><br><div class='opt-line'><b>B.<\/b> The ciliary ganglion lies lateral to the optic nerve within the orbit<\/div><br><div class='opt-line'><b>C.<\/b> The fourth cranial nerve enters the orbit through the inferior orbital fissure<\/div><br><div class='opt-line'><b>D.<\/b> The fifth cranial nerve has a large sensory and smaller motor root<\/div><br><div class='opt-line'><b>E.<\/b> The sixth nerve passes through the cavernous sinus lateral to the internal carotid artery<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The third cranial nerve has only somatic motor and parasympathetic motor fibres<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The fourth cranial nerve enters the orbit through the superior orbital fissure<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 7 › Exam 7 b","front":"<b>The abdominal aorta<\/b><br><div class='opt-line'><b>A.<\/b> Starts at the level of T10 vertebra<\/div><br><div class='opt-line'><b>B.<\/b> Is crossed anteriorly by the splenic vein<\/div><br><div class='opt-line'><b>C.<\/b> Gives off suprarenal branches on both sides<\/div><br><div class='opt-line'><b>D.<\/b> Gives off the inferior phrenic arteries at its commencement<\/div><br><div class='opt-line'><b>E.<\/b> Gives off the inferior epigastric artery at its bifurcation<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The abdominal aorta starts at the level of T12 vertebra<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The inferior epigastric artery arises from the external iliac artery, not from the bifurcation of the abdominal aorta<\/div>","due":33},{"section":"Exam 7 › Exam 7 b","front":"<b>The inferior vena cava<\/b><br><div class='opt-line'><b>A.<\/b> has a longer course than the aorta in the abdomen<\/div><br><div class='opt-line'><b>B.<\/b> Begins at the level of the fifth lumbar vertebra<\/div><br><div class='opt-line'><b>C.<\/b> Receives the inferior epigastric veins<\/div><br><div class='opt-line'><b>D.<\/b> Is crossed by the root of the ileal mesentery<\/div><br><div class='opt-line'><b>E.<\/b> Is closely related to the first part of the duodenum<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Receives the external iliac veins<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 7 › Exam 7 b","front":"<b>The following are true<\/b><br><div class='opt-line'><b>A.<\/b> The cricoid cartilage forms a complete ring in transverse section<\/div><br><div class='opt-line'><b>B.<\/b> The true vocal cords lie inferior to the cricothyroid membrane<\/div><br><div class='opt-line'><b>C.<\/b> The aryepiglottic folds move towards each other during swallowing<\/div><br><div class='opt-line'><b>D.<\/b> The true vocal cords are adducted during gentle respiration<\/div><br><div class='opt-line'><b>E.<\/b> The epiglottis commonly calcifies in the adult<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The true vocal cords lie superior to the cricothyroid membrane<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The true vocal cords are abducted during gentle respiration<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The epiglottis rarely calcifies in adults<\/div>","due":33},{"section":"Exam 7 › Exam 7 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> Sternocleidomastoid has one head attached to the medial half of the clavicle<\/div><br><div class='opt-line'><b>B.<\/b> The scalenus anterior is attached superiorly to the anterior tubercles of lower three cervical vertebrae<\/div><br><div class='opt-line'><b>C.<\/b> The phrenic nerve lies posterior to scalenus anterior<\/div><br><div class='opt-line'><b>D.<\/b> The scalenus medius is attached inferiorly to the second rib<\/div><br><div class='opt-line'><b>E.<\/b> There are five pairs of strap muscles lying anteriorly in the neck<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The scalenus anterior is attached to C3-C6 vertebrae<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The phrenic nerve lies anterior to scalenus anterior<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Scalenus medius is attached to the first rib<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; There are four pairs of strap muscles in the neck<\/div>","due":33},{"section":"Exam 7 › Exam 7 b","front":"<b>Regarding the mandible<\/b><br><div class='opt-line'><b>A.<\/b> It is in contact with the lingual nerve<\/div><br><div class='opt-line'><b>B.<\/b> It gives attachment to the sphenomandibular ligament at the lingula<\/div><br><div class='opt-line'><b>C.<\/b> It ossifies in membrane<\/div><br><div class='opt-line'><b>D.<\/b> It is retracted by the horizontal fibres of temporalis<\/div><br><div class='opt-line'><b>E.<\/b> It arises from the second pharyngeal arch<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The mandible arises from the first pharyngeal arch<\/div>","due":33},{"section":"Exam 7 › Exam 7 b","front":"<b>Regarding the walls of the pelvis<\/b><br><div class='opt-line'><b>A.<\/b> Piriformis extends from the middle three sacral segments<\/div><br><div class='opt-line'><b>B.<\/b> Obturator internus arises from the bony margins of the obturator foramen<\/div><br><div class='opt-line'><b>C.<\/b> The obturator artery passes through the obturator canal below the obturator membrane<\/div><br><div class='opt-line'><b>D.<\/b> The sacral plexus is directly related to piriformis<\/div><br><div class='opt-line'><b>E.<\/b> Coccygeus (Ischiococcygeus) muscle lies above piriformis<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The obturator artery passes through the obturator canal above the obturator membrane<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Coccygeus lies below piriformis<\/div>","due":34},{"section":"Exam 7 › Exam 7 b","front":"<b>The following are true<\/b><br><div class='opt-line'><b>A.<\/b> The cisterna chyli is anterior to the bodies of L1 and L2<\/div><br><div class='opt-line'><b>B.<\/b> The thoracic duct passes through the diaphragm at level T10<\/div><br><div class='opt-line'><b>C.<\/b> The terminal parts of the hemi azygous system pass behind the thoracic duct to enter the azygous vein<\/div><br><div class='opt-line'><b>D.<\/b> The right lymphatic duct is about 5cm long<\/div><br><div class='opt-line'><b>E.<\/b> The normal length of the thoracic duct is 25cm<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The thoracic duct passes through at T12<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The right lymphatic duct is only about 1 cm<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The normal length of the thoracic duct is about 45cm<\/div>","due":34},{"section":"Exam 7 › Exam 7 b","front":"<b>The following statements are true regarding the talus<\/b><br><div class='opt-line'><b>A.<\/b> It is the largest of the tarsal bones<\/div><br><div class='opt-line'><b>B.<\/b> It starts to ossify in the 9th fetal month<\/div><br><div class='opt-line'><b>C.<\/b> The lateral tubercle is the most posterior part of the talus<\/div><br><div class='opt-line'><b>D.<\/b> The medial and lateral tubercles are separated by a groove for flexor hallucis longus<\/div><br><div class='opt-line'><b>E.<\/b> The neck is grooved inferiorly as the sulcus tarsi<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The calcaneus is the largest of the tarsal bones<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It starts to ossify in the 7th fetal month<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":36},{"section":"Exam 7 › Exam 7 b","front":"<b>At mid-humerus level<\/b><br><div class='opt-line'><b>A.<\/b> The profunda brachii vessels lie lateral to the humerus<\/div><br><div class='opt-line'><b>B.<\/b> The brachial artery lies lateral to the median nerve<\/div><br><div class='opt-line'><b>C.<\/b> The basilic vein perforates the deep fascia of the arm<\/div><br><div class='opt-line'><b>D.<\/b> The radial nerve lies medial to the humerus<\/div><br><div class='opt-line'><b>E.<\/b> The brachial artery lies in contact with the humerus<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The radial nerve lies lateral to the humerus<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The brachial artery lies medial to the humerus on brachialis and the triceps muscles<\/div>","due":41},{"section":"Exam 7 › Exam 7 b","front":"<b>Regarding lymphatic drainage<\/b><br><div class='opt-line'><b>A.<\/b> The gallbladder drains to nodes around the porta hepatis<\/div><br><div class='opt-line'><b>B.<\/b> The posterior abdominal wall drains to para-aortic nodes<\/div><br><div class='opt-line'><b>C.<\/b> The bare area of the liver drains to coeliac nodes<\/div><br><div class='opt-line'><b>D.<\/b> The inferior surface of the diaphragm drains to pre-aortic nodes<\/div><br><div class='opt-line'><b>E.<\/b> The lower oesophagus drains to coeliac nodes<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; drains to para- aortic nodes<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The inferior surface of the diaphragm drains to para-aortic nodes<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":42},{"section":"Exam 7 › Exam 7 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> Of the 12 pairs of ribs, 7 are true, 4 are false, and 1 is floating<\/div><br><div class='opt-line'><b>B.<\/b> Each typical rib has 2 facets, 1 articulating with the same vertebral level and the 1 with the vertebra below<\/div><br><div class='opt-line'><b>C.<\/b> The costovertebral and costotransverse joints of a typical rib are of synovial type<\/div><br><div class='opt-line'><b>D.<\/b> The first rib is grooved posteriorly by the subclavian vein<\/div><br><div class='opt-line'><b>E.<\/b> The scalenus anterior muscle is attached to first and second ribs<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; There are 7 true ribs, 3 false ribs, and 2 floating ribs<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Each typical rib articulates with the same vertebral level and the one above it<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":42},{"section":"Exam 7 › Exam 7 b","front":"<b>The following are ectodermal in origin<\/b><br><div class='opt-line'><b>A.<\/b> Mouth<\/div><br><div class='opt-line'><b>B.<\/b> Lower anal canal<\/div><br><div class='opt-line'><b>C.<\/b> Membranous labyrinth<\/div><br><div class='opt-line'><b>D.<\/b> Ciliary body and iris<\/div><br><div class='opt-line'><b>E.<\/b> Tympanic antrum<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The tympanic antrum is derived from the endoderm<\/div>","due":42},{"section":"Exam 7 › Exam 7 b","front":"<b>Regarding the cerebellum<\/b><br><div class='opt-line'><b>A.<\/b> It is connected by three pairs of cerebellar peduncles to the brain stem<\/div><br><div class='opt-line'><b>B.<\/b> The tonsils are the most inferior part of the cerebellar hemisphere<\/div><br><div class='opt-line'><b>C.<\/b> The anterior inferior cerebellar artery and the superior cerebellar artery arise from the basilar artery<\/div><br><div class='opt-line'><b>D.<\/b> The deepest fissure is the primary fissure at the superior surface<\/div><br><div class='opt-line'><b>E.<\/b> A CT of the upper cerebellum contains the cerebellum posteriorly and occipital lobes antero-laterally<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The deepest fissure is the horizontal fissure<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; CT of the upper cerebellum contains the cerebellum anteriorly and the occipital lobes postero- laterally<\/div>","due":43},{"section":"Exam 7 › Exam 7 b","front":"<b>Regarding the knee<\/b><br><div class='opt-line'><b>A.<\/b> The posterior cruciate ligament is attached to the lateral femoral condyle<\/div><br><div class='opt-line'><b>B.<\/b> The anterior cruciate ligament prevents backward displacement of the tibia<\/div><br><div class='opt-line'><b>C.<\/b> The semimembranosus bursa communicates directly with the knee joint<\/div><br><div class='opt-line'><b>D.<\/b> The cruciate ligaments are of high signal on T1 weighted MRI scans<\/div><br><div class='opt-line'><b>E.<\/b> The ossification centre for the patella appears at 3 years<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The posterior cruciate ligament is attached to the medial femoral condyle<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The anterior cruciate ligament prevents forward displacement of the tibia<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The semimembranosus bursa communicates indirectly with the knee joint via the gastrocnemius bursa<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The cruciate ligaments are of low signal on T1 weighted MRI scans<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":43},{"section":"Exam 7 › Exam 7 b","front":"<b>Regarding wrist and hand radiography<\/b><br><div class='opt-line'><b>A.<\/b> Two views are sufficient if scaphoid injury is suspected<\/div><br><div class='opt-line'><b>B.<\/b> The left hand is usually used for bone age<\/div><br><div class='opt-line'><b>C.<\/b> The distal radial articulation is angled about 12 degrees in the volar direction<\/div><br><div class='opt-line'><b>D.<\/b> The radial and ulnar styloid processes should be superimposed on a lateral wrist radiograph<\/div><br><div class='opt-line'><b>E.<\/b> A clenched fist view can be used to assess carpal instability<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Four views are needed to rule out scaphoid injury<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":43},{"section":"Exam 7 › Exam 7 b","front":"<b>The ovaries<\/b><br><div class='opt-line'><b>A.<\/b> Are supplied by a branch of the external iliac artery<\/div><br><div class='opt-line'><b>B.<\/b> Drain lymph to para-aortic nodes<\/div><br><div class='opt-line'><b>C.<\/b> Are covered by peritoneum<\/div><br><div class='opt-line'><b>D.<\/b> Measure approx. 2 cm in diameter<\/div><br><div class='opt-line'><b>E.<\/b> Attach to the uterus by the suspensory ligament of the ovary<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The ovaries are supplied by the ovarian artery directly from the aorta<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The ovaries attach to the uterus by the ovarian ligament, not the suspensory ligament<\/div>","due":43},{"section":"Exam 7 › Exam 7 b","front":"<b>Regarding the gallbladder (GB)<\/b><br><div class='opt-line'><b>A.<\/b> The neck is related to the lesser omentum<\/div><br><div class='opt-line'><b>B.<\/b> It is absent in 0.5% of cases<\/div><br><div class='opt-line'><b>C.<\/b> The neck contains spiral folds of mucosa (Valves of Heister)<\/div><br><div class='opt-line'><b>D.<\/b> It may be double in 1% of cases<\/div><br><div class='opt-line'><b>E.<\/b> It may have a mesentery<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It is absent in approximately 0.05% of cases<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It may be double in approximately 0.025% of cases<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":43},{"section":"Exam 7 › Exam 7 b","front":"<b>Regarding the right atrium<\/b><br><div class='opt-line'><b>A.<\/b> Its anterior wall is smooth and into which the great vein drains<\/div><br><div class='opt-line'><b>B.<\/b> The coronary sinus drains into the right atrium between the orifice of the IVC and the tricuspid valve<\/div><br><div class='opt-line'><b>C.<\/b> The fossa ovalis is an oval depression on the upper part of the inter-atrial septum<\/div><br><div class='opt-line'><b>D.<\/b> The crista terminalis separates the right atrium from its appendage<\/div><br><div class='opt-line'><b>E.<\/b> The posterior wall is smoother when compared to its anterior wall<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The anterior wall is rough and contains pectinate muscles<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The fossa ovalis lies at the lower part of the inter- atrial septum<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":43},{"section":"Exam 7 › Exam 7 b","front":"<b>Regarding the aorta<\/b><br><div class='opt-line'><b>A.<\/b> The ascending aorta is about 10cm long<\/div><br><div class='opt-line'><b>B.<\/b> The right pulmonary artery is posterior to the lower part of ascending aorta<\/div><br><div class='opt-line'><b>C.<\/b> The right main bronchus lies anterior to the lower part of the ascending aorta<\/div><br><div class='opt-line'><b>D.<\/b> The left vagus nerve lies anterior to the descending aorta<\/div><br><div class='opt-line'><b>E.<\/b> The left recurrent laryngeal nerve passes upwards posterior to the arch of aorta<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The ascending aorta is about 5cm long<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The right main bronchus lies posterior to the ascending aorta<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The left vagus nerve lies posterior to the descending aorta<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":43},{"section":"Exam 7 › Exam 7 c","front":"<b>Endoscopic Ultrasound<\/b><br><div class='opt-line'><b>A.<\/b> Is performed via an end view scope<\/div><br><div class='opt-line'><b>B.<\/b> Uses a mechanical sector probe<\/div><br><div class='opt-line'><b>C.<\/b> The scope has a rigid end<\/div><br><div class='opt-line'><b>D.<\/b> The patient lies on their right side<\/div><br><div class='opt-line'><b>E.<\/b> Orientation is dependent on distance from incisors<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It uses an oblique view linear array probe<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It uses a linear array probe<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The patient typically lies on their left side<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 7 › Exam 7 c","front":"<b>Regarding urethrography<\/b><br><div class='opt-line'><b>A.<\/b> The prostatic urethra is best demonstrated during micturition<\/div><br><div class='opt-line'><b>B.<\/b> Filling of Cowper&#x27;s gland is a normal finding<\/div><br><div class='opt-line'><b>C.<\/b> An ascending urethrogram demonstrates anatomy well up to the internal sphincter<\/div><br><div class='opt-line'><b>D.<\/b> The Foley catheter balloon is inflated in the fossa navalis during an ascending urethrogram<\/div><br><div class='opt-line'><b>E.<\/b> The bladder volume increases by approximately 80 mls per annum in a child<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; An ascending urethrogram demonstrates up to the distal or external sphinctre.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The Foley catheter balloon lies in the fossa navicularis .<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The bladder volume increases by approximately 30 mls per annum in a child<\/div>","due":33},{"section":"Exam 7 › Exam 7 c","front":"<b>Regarding renal ultrasonography<\/b><br><div class='opt-line'><b>A.<\/b> Renal length is accurate to within 1 cm (approximately 10%) in 95% of cases<\/div><br><div class='opt-line'><b>B.<\/b> The renal cortex is thicker medially than laterally<\/div><br><div class='opt-line'><b>C.<\/b> The cortical thickness is that between the renal capsule and the outer aspect of the medullary pyramid<\/div><br><div class='opt-line'><b>D.<\/b> The cortical thickness is that between the renal capsule and the margin of the sinus echoes<\/div><br><div class='opt-line'><b>E.<\/b> The normal kidney is hypoechoic to liver or spleen<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The renal cortex is typically thicker laterally than medially<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; this is the definition of parenchymal thickness<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 7 › Exam 7 c","front":"<b>Regarding oral cholangiography<\/b><br><div class='opt-line'><b>A.<\/b> An erect film is useful to demonstrate floating gallstones<\/div><br><div class='opt-line'><b>B.<\/b> Gallbladder contractility is evaluated by giving a fatty meal<\/div><br><div class='opt-line'><b>C.<\/b> Non-opacification of the gallbladder is diagnostic of chronic cholecystitis<\/div><br><div class='opt-line'><b>D.<\/b> A preliminary film is mandatory<\/div><br><div class='opt-line'><b>E.<\/b> Pseudalbuminuria is a side effect<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Non-opacification may also be caused by a blockage or functional issues<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A preliminary film is not mandatory but often recommended<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 7 › Exam 7 c","front":"<b>Regarding abdominal ultrasound<\/b><br><div class='opt-line'><b>A.<\/b> Following cholecystectomy, the common bile duct can measure up to 1.5 cm<\/div><br><div class='opt-line'><b>B.<\/b> The cystic duct is visible in approximately 50%<\/div><br><div class='opt-line'><b>C.<\/b> The pancreatic duct usually measures less on ultrasound than at ERCP<\/div><br><div class='opt-line'><b>D.<\/b> The upper limit of normal for the pancreatic duct is 3.5 mm in diameter<\/div><br><div class='opt-line'><b>E.<\/b> The intraductal transducers have frequencies of 7.5-12 MHz<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; the CBD can measure up to 10 mm.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The upper limit of normal for the pancreatic duct is 2.5 mm<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 20-30 Mhz<\/div>","due":33},{"section":"Exam 7 › Exam 7 c","front":"<b>Regarding biopsy of the liver<\/b><br><div class='opt-line'><b>A.<\/b> Paracentesis should be performed prior to a percutaneous liver biopsy<\/div><br><div class='opt-line'><b>B.<\/b> A percutaneous liver biopsy should be performed in arrested respiration<\/div><br><div class='opt-line'><b>C.<\/b> A transvenous large cutting needle biopsy is contraindicated if there is a bleeding diathesis<\/div><br><div class='opt-line'><b>D.<\/b> A plugged biopsy requires direct visualization of the liver capsule<\/div><br><div class='opt-line'><b>E.<\/b> A brush biopsy can be performed via a T-tube catheter<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A transvenous large cutting needle biopsy is the method of choice in severe clotting disorders.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A plugged biopsy doesn&#x27;t always require direct visualization<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 7 › Exam 7 c","front":"<b>When performing an orthopantomogram<\/b><br><div class='opt-line'><b>A.<\/b> Only the x-ray tube moves<\/div><br><div class='opt-line'><b>B.<\/b> The film cassette and x-ray tube move in opposite directions<\/div><br><div class='opt-line'><b>C.<\/b> The film is in a curved cassette<\/div><br><div class='opt-line'><b>D.<\/b> The cervical spine is demonstrated three times<\/div><br><div class='opt-line'><b>E.<\/b> The arc of rotation of the x-ray tube and film is always circular<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Both the x-ray tube and the film cassette move<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The arc is often elliptical<\/div>","due":33},{"section":"Exam 7 › Exam 7 c","front":"<b>Barium Swallow - Dynamic studies<\/b><br><div class='opt-line'><b>A.<\/b> Cine has higher radiation dose than rapid serial roll film<\/div><br><div class='opt-line'><b>B.<\/b> Cine has lower frame rate than rapid serial roll film<\/div><br><div class='opt-line'><b>C.<\/b> Should always be performed as part of routine barium swallow<\/div><br><div class='opt-line'><b>D.<\/b> Speed of 5 frames per second is sufficient<\/div><br><div class='opt-line'><b>E.<\/b> Multiple boluses of contrast should be given at any one time<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Cine typically has a higher frame rate<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Cine studies are not always routine<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Speed of 6-16 frames per second is typically required<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Only one bolus should be given at a time<\/div>","due":33},{"section":"Exam 7 › Exam 7 c","front":"<b>Routine MRI of the knee includes<\/b><br><div class='opt-line'><b>A.<\/b> True sagittal views<\/div><br><div class='opt-line'><b>B.<\/b> Volume coronal sequences<\/div><br><div class='opt-line'><b>C.<\/b> Axial sequences<\/div><br><div class='opt-line'><b>D.<\/b> Sagittal obliques<\/div><br><div class='opt-line'><b>E.<\/b> Axial images showing both knees<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Volume coronal sequences are not typically routine<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Only in patients with specific symptoms such as anterior knee pain are axial sequences required<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Only the symptomatic knee is typically imaged<\/div>","due":33},{"section":"Exam 7 › Exam 7 c","front":"<b>Radiopharmaceuticals for lung perfusion studies<\/b><br><div class='opt-line'><b>A.<\/b> 5-20 nm particles used<\/div><br><div class='opt-line'><b>B.<\/b> Albumin particles can be used<\/div><br><div class='opt-line'><b>C.<\/b> Carbon particles can be used<\/div><br><div class='opt-line'><b>D.<\/b> Drawing blood into the syringe can cause clumping<\/div><br><div class='opt-line'><b>E.<\/b> Particles occlude small lung vessels<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 10-100 micrometer particles are used.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Carbon particles are used only in ventilation scan NOT perfusion scan<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 7 › Exam 7 c","front":"<b>Contraindications to V/Q scanning include<\/b><br><div class='opt-line'><b>A.<\/b> Severe heart failure<\/div><br><div class='opt-line'><b>B.<\/b> Left to right cardiac shunt<\/div><br><div class='opt-line'><b>C.<\/b> Severe pulmonary hypertension<\/div><br><div class='opt-line'><b>D.<\/b> Bleeding diathesis<\/div><br><div class='opt-line'><b>E.<\/b> Asthma<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Left-to-right shunts do not typically contraindicate V/Q scanning<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Asthma is not an absolute contraindication<\/div>","due":33},{"section":"Exam 7 › Exam 7 c","front":"<b>Wrist Arthrography<\/b><br><div class='opt-line'><b>A.<\/b> 2-4 mls contrast is required<\/div><br><div class='opt-line'><b>B.<\/b> 2-4 mls air is required<\/div><br><div class='opt-line'><b>C.<\/b> The wrist should be flexed 10-15 degrees<\/div><br><div class='opt-line'><b>D.<\/b> Injection site is the mid carpal region<\/div><br><div class='opt-line'><b>E.<\/b> Early views should be taken<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Wrist arthrograms are only performed in single contrast<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The injection is into the radiocarpal compartment<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":41},{"section":"Exam 7 › Exam 7 c","front":"<b>The following are true<\/b><br><div class='opt-line'><b>A.<\/b> An intravenous pyelogram is contraindicated within 48 hours of birth<\/div><br><div class='opt-line'><b>B.<\/b> A direct radionuclide micturating cystogram gives a ten fold lower dose than a radiographic micturating cystogram<\/div><br><div class='opt-line'><b>C.<\/b> A direct radionuclide micturating cystogram is less sensitive than a radiographic micturating cystogram at detecting vesicoureteric reflux<\/div><br><div class='opt-line'><b>D.<\/b> An indirect radionuclide micturating cystogram is performed 1-2 hours following an injection of 99m Tc-labelled Mag 3 or 99mTc-labelled DTPA<\/div><br><div class='opt-line'><b>E.<\/b> Indirect micturating cystogram is more sensitive than a radiographic micturating cystogram at demonstrating reflux during voiding<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The dose of a direct radionuclide study is 20 times less than a radiographic one.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A direct radionuclide micturating cystogram is more sensitive<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":42},{"section":"Exam 7 › Exam 7 c","front":"<b>The following are true of imaging the pancreas<\/b><br><div class='opt-line'><b>A.<\/b> Water is an appropriate oral contrast media for CT<\/div><br><div class='opt-line'><b>B.<\/b> The pancreas parenchyma enhances maximally during the portal venous phase<\/div><br><div class='opt-line'><b>C.<\/b> The normal duct measures up to 2 mm in diameter in the body of the pancreas on ultrasound<\/div><br><div class='opt-line'><b>D.<\/b> The normal duct measures up to 6.5 mm at the head of the pancreas at ERCP<\/div><br><div class='opt-line'><b>E.<\/b> The number of side branches of the pancreatic duct opacifying at ERCP decreases with age<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The pancreas has a purely arterial blood supply and no portal phase .<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":42},{"section":"Exam 7 › Exam 7 c","front":"<b>Double contrast barium enema - Technique<\/b><br><div class='opt-line'><b>A.<\/b> Run barium initially in right lateral position<\/div><br><div class='opt-line'><b>B.<\/b> Filling should be continued to the mid-transverse colon<\/div><br><div class='opt-line'><b>C.<\/b> Fill cecum in right lateral position<\/div><br><div class='opt-line'><b>D.<\/b> Turn patient around twice<\/div><br><div class='opt-line'><b>E.<\/b> Air insufflation in supine position<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Barium is run in in the left lateral position or prone<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Air insufflation should be done in the prone position<\/div>","due":42},{"section":"Exam 7 › Exam 7 c","front":"<b>Nuclear Medicine gastro-oesophageal reflux studies in infants<\/b><br><div class='opt-line'><b>A.<\/b> Normal milk feed used<\/div><br><div class='opt-line'><b>B.<\/b> Tracer given before feed<\/div><br><div class='opt-line'><b>C.<\/b> Infant is placed in a right lateral decubitus position<\/div><br><div class='opt-line'><b>D.<\/b> Dynamic imaging for 30-60 minutes<\/div><br><div class='opt-line'><b>E.<\/b> Four-hour images are performed<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The infant is placed in a supine or prone position<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":42},{"section":"Exam 7 › Exam 7 c","front":"<b>Pulmonary angiography<\/b><br><div class='opt-line'><b>A.<\/b> Is contraindicated with a mean PA pressure of &gt;30 mm of Hg<\/div><br><div class='opt-line'><b>B.<\/b> A mean PA pressure of 10 is normal<\/div><br><div class='opt-line'><b>C.<\/b> Requires a pigtail catheter<\/div><br><div class='opt-line'><b>D.<\/b> Requires a vascular sheath<\/div><br><div class='opt-line'><b>E.<\/b> Puncture the most easily palpable pulse<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; if greater than 50 mm per<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; a vascular sheath not necessary<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It is the femoral vein that is punctured for this procedure<\/div>","due":42},{"section":"Exam 7 › Exam 7 c","front":"<b>The following are true regarding vascular guide wires<\/b><br><div class='opt-line'><b>A.<\/b> The size is measured by the diameter<\/div><br><div class='opt-line'><b>B.<\/b> The diameter is in cm<\/div><br><div class='opt-line'><b>C.<\/b> Standard adult wire is a 0.035<\/div><br><div class='opt-line'><b>D.<\/b> Standard pediatric wire is 0.018<\/div><br><div class='opt-line'><b>E.<\/b> Standard interventional wire is 0.038<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The diameter is usually measured in inches or fractions of inches<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; standard paediatric wire is 0.025<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":43},{"section":"Exam 7 › Exam 7 c","front":"<b>IV DSA<\/b><br><div class='opt-line'><b>A.<\/b> Uses larger volumes of contrast than intra-arterial studies<\/div><br><div class='opt-line'><b>B.<\/b> Uses a higher concentration of contrast than intra-arterial studies<\/div><br><div class='opt-line'><b>C.<\/b> Has a lower rate of contrast reactions than intra-arterial studies<\/div><br><div class='opt-line'><b>D.<\/b> Must be injected through a central line<\/div><br><div class='opt-line'><b>E.<\/b> Should have ECG monitoring<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; IV DSA tends to have higher contrast reactions<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; IV DSA can be injected through a peripheral line<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Only with patients with a cardiac history need cardiac monitoring<\/div>","due":43},{"section":"Exam 7 › Exam 7 c","front":"<b>HRCT Lungs<\/b><br><div class='opt-line'><b>A.<\/b> Windowing is centered at 40 hU<\/div><br><div class='opt-line'><b>B.<\/b> A window width of 1600 hU is used<\/div><br><div class='opt-line'><b>C.<\/b> The dose from a 1 mm section is less than a 2 mm section<\/div><br><div class='opt-line'><b>D.<\/b> The same collimation is used for a 1 mm and 2 mm slice<\/div><br><div class='opt-line'><b>E.<\/b> Expiration scans are helpful<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Windowing is centered at 600 hU<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The dose is similar for both 1 mm and 2 mm slices<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":43}];

const sections=[...new Set(cards.map(x=>x.section))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));section.innerHTML='<option value="">كل المجموعات</option>'+sections.map(x=>`<option>${x}</option>`).join('');
function strip(s){const d=document.createElement('div');d.innerHTML=s;return d.textContent.toLowerCase()}
function filter(){const q=search.value.trim().toLowerCase();shown=cards.filter(c=>(!section.value||c.section===section.value)&&(!q||strip(c.front+' '+c.back).includes(q)));i=0;render()}
function render(){if(!shown.length){front.innerHTML='<div class="empty">لا توجد بطاقات مطابقة</div>';back.innerHTML='';counter.textContent='0 / 0';bar.style.width='0%';return}const c=shown[i];front.innerHTML=c.front;back.innerHTML=c.back;back.classList.remove('show');document.getElementById('reveal').textContent='إظهار الإجابة';counter.textContent=`${i+1} / ${shown.length} — ${c.section}`;bar.style.width=`${(i+1)/shown.length*100}%`}
section.onchange=filter;search.oninput=filter;document.getElementById('next').onclick=()=>{if(shown.length){i=(i+1)%shown.length;render()}};document.getElementById('prev').onclick=()=>{if(shown.length){i=(i-1+shown.length)%shown.length;render()}};document.getElementById('reveal').onclick=e=>{back.classList.toggle('show');e.target.textContent=back.classList.contains('show')?'إخفاء الإجابة':'إظهار الإجابة'};document.onkeydown=e=>{if(e.key==='ArrowLeft')document.getElementById('next').click();if(e.key==='ArrowRight')document.getElementById('prev').click();if(e.key===' ') {e.preventDefault();document.getElementById('reveal').click()}};filter();
</script></body></html>
