e-columns:1fr}.card{min-height:420px}.actions{grid-template-columns:1fr 1fr}.reveal{grid-column:1/3;grid-row:1}}

<script>
const cards=[{"section":"Exam 1 › Exam 1 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The left main bronchus is 2 cm long and 1.2 cm wide<\/div><br><div class='opt-line'><b>B.<\/b> The anterior relation of the left main bronchus is the pulmonary trunk<\/div><br><div class='opt-line'><b>C.<\/b> The posterior relation of the left main bronchus are oesophagus and IVC to its right<\/div><br><div class='opt-line'><b>D.<\/b> One of the superior relations of the left main bronchus is the pulmonary artery<\/div><br><div class='opt-line'><b>E.<\/b> The lingula lobe bronchus comes off the lower lobe bronchus and has superior and inferior divisions<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The left main bronchus is 5 cm long.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The posterior relations of the left main bronchus are oesophagus and descending aorta<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The lingula lobe bronchus comes off the upper lobe bronchus.<\/div>","due":35},{"section":"Exam 1 › Exam 1 b","front":"<b>The coeliac artery<\/b><br><div class='opt-line'><b>A.<\/b> Is the artery of the embryonic mid gut<\/div><br><div class='opt-line'><b>B.<\/b> Has a branch supplying the oesophagus<\/div><br><div class='opt-line'><b>C.<\/b> Gives off the right gastric artery<\/div><br><div class='opt-line'><b>D.<\/b> Arises from the abdominal aorta behind the median arcuate ligament<\/div><br><div class='opt-line'><b>E.<\/b> Supplies the third part of the duodenum<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The coeliac artery is the artery of the foregut, not the midgut.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The right gastric artery is a branch from the common hepatic artery<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The coeliac artery supplies the first and second parts of the duodenum.<\/div>","due":36},{"section":"Exam 1 › Exam 1 b","front":"<b>The following are true about ligaments of the vertebral column<\/b><br><div class='opt-line'><b>A.<\/b> The anterior longitudinal ligament extends from the basilar part of the occipital bone to the upper sacrum<\/div><br><div class='opt-line'><b>B.<\/b> The posterior longitudinal ligament is firmly attached to the intervertebral discs<\/div><br><div class='opt-line'><b>C.<\/b> The supraspinous ligament is replaced as the ligamentum nuchae above the 4th thoracic vertebra<\/div><br><div class='opt-line'><b>D.<\/b> The ligamentum flavum passes from the posterior surface of one lamina to the anterior surface of the lamina below<\/div><br><div class='opt-line'><b>E.<\/b> In CT and MRI, the ligamentum flavum appears thicker in successively lower axial slices<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Ligamentum nuchae is represented above level C7.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The ligamentum flavum passes from anterior surface of one lamina to the posterior surface of the lamina below.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":36},{"section":"Exam 1 › Exam 1 b","front":"<b>Regarding blood supply to the lower limb<\/b><br><div class='opt-line'><b>A.<\/b> The popliteal artery ends as it passes under the fibrous arch of soleus muscle<\/div><br><div class='opt-line'><b>B.<\/b> Popliteus tendon separates the popliteal artery from the posterior surface of the femur<\/div><br><div class='opt-line'><b>C.<\/b> The anterior tibial artery crosses the ankle joint midway between the malleoli<\/div><br><div class='opt-line'><b>D.<\/b> The posterior tibial artery can be palpated anterior to the medial malleolus<\/div><br><div class='opt-line'><b>E.<\/b> The calcaneal artery is a branch of the peroneal artery<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Popliteus tendon is lateral to the popliteal artery<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The posterior tibial artery can be palpated posterior to the medial malleolus.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":37},{"section":"Exam 1 › Exam 1 b","front":"<b>Regarding the fourth ventricle<\/b><br><div class='opt-line'><b>A.<\/b> It is the cavity of mid and hind brain<\/div><br><div class='opt-line'><b>B.<\/b> The cavity is heart-shaped when viewed from behind<\/div><br><div class='opt-line'><b>C.<\/b> The roof of the cavity superiorly is formed by the superior medullary velum<\/div><br><div class='opt-line'><b>D.<\/b> The inferior medullary velum lies between the superior cerebellar peduncles<\/div><br><div class='opt-line'><b>E.<\/b> It has two medial and two lateral openings to communicate with the subarachnoid spaces<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Fourth ventricle is the cavity of hind brain only<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The cavity is diamond-shaped when viewed from behind.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The inferior medullary velum lies between the inferior cerebellar peduncles.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; There is only one median and two lateral openings<\/div>","due":37},{"section":"Exam 1 › Exam 1 b","front":"<b>Regarding the venous drainage of the leg<\/b><br><div class='opt-line'><b>A.<\/b> The small saphenous vein pierces deep fascia to enter the popliteal vein in the popliteal fossa<\/div><br><div class='opt-line'><b>B.<\/b> The long saphenous vein enters the femoral vein just proximal to the inguinal ligament<\/div><br><div class='opt-line'><b>C.<\/b> The long saphenous vein has no valves above the knee<\/div><br><div class='opt-line'><b>D.<\/b> Paired venae comitantes accompany the three main arteries in the calf<\/div><br><div class='opt-line'><b>E.<\/b> The profunda femoris vein joins the femoral vein posteriorly 4-12 cm below the inguinal ligament<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The long saphenous vein enters the femoral vein distal to the inguinal ligament<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The long saphenous vein contains valves above the knee.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":38},{"section":"Exam 1 › Exam 1 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> Humeral supracondylar fossae are more common in females<\/div><br><div class='opt-line'><b>B.<\/b> The carpal angle normally measures 150-170 degrees<\/div><br><div class='opt-line'><b>C.<\/b> The radial collateral ligament is attached to the annular ligament<\/div><br><div class='opt-line'><b>D.<\/b> A sesamoid bone is seen at the thumb interphalangeal joint in 10% of cases<\/div><br><div class='opt-line'><b>E.<\/b> A notch may be seen on the medial aspect of the distal radius of a child<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The average carpal angle is 135-140 degree<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A sesamoid bone is seen in approximately 73% of cases.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":38},{"section":"Exam 1 › Exam 1 b","front":"<b>The hypothalamus includes the following<\/b><br><div class='opt-line'><b>A.<\/b> Infundibular stalk<\/div><br><div class='opt-line'><b>B.<\/b> Optic chiasm<\/div><br><div class='opt-line'><b>C.<\/b> Posterior perforated substance<\/div><br><div class='opt-line'><b>D.<\/b> Mamillary bodies<\/div><br><div class='opt-line'><b>E.<\/b> Tuber cinereum<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":38},{"section":"Exam 1 › Exam 1 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> Lymphoid follicles in the rectum may measure up to 6 mm normally<\/div><br><div class='opt-line'><b>B.<\/b> The post rectal space may measure up to 2 cm at S4 level<\/div><br><div class='opt-line'><b>C.<\/b> The lesser and greater sacs communicate through the epiploic foramen<\/div><br><div class='opt-line'><b>D.<\/b> The gastroduodenal artery passes anterior to the neck of the pancreas<\/div><br><div class='opt-line'><b>E.<\/b> The portal vein lies posterior to the epiploic foramen<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Lymphoid follicles in the rectum normally measure up to 4 mm.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The post rectal space may measure up to 1.5 cm at the S4 level.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The portal vein lies anterior to the epiploic foramen.<\/div>","due":39},{"section":"Exam 1 › Exam 1 b","front":"<b>At the shoulder<\/b><br><div class='opt-line'><b>A.<\/b> The joint capsule is attached to the surgical neck of the humerus around anatomical<\/div><br><div class='opt-line'><b>B.<\/b> The subacromial bursa communicates with the shoulder joint<\/div><br><div class='opt-line'><b>C.<\/b> The tendon of the long head of the biceps lies within the joint<\/div><br><div class='opt-line'><b>D.<\/b> The humeral epiphysis is wholly intracapsular<\/div><br><div class='opt-line'><b>E.<\/b> Deltoid causes flexion of the arm<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The joint capsule is attached around the anatomical neck of the humerus<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The subacromial bursa does not normally communicate with the shoulder joint.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The humeral epiphysis is located partly inside and partly outside the capsule.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":40},{"section":"Exam 1 › Exam 1 b","front":"<b>Regarding the mandible<\/b><br><div class='opt-line'><b>A.<\/b> The symphysis menti fuses by adolescence<\/div><br><div class='opt-line'><b>B.<\/b> Most of the permanent dentition calcify by three years of age<\/div><br><div class='opt-line'><b>C.<\/b> The first permanent molar erupts by six months in majority<\/div><br><div class='opt-line'><b>D.<\/b> During arthrography of the temporomandibular joint, both upper and lower synovial spaces can be visualized by one injection into either space<\/div><br><div class='opt-line'><b>E.<\/b> The mental foramen lies between the premolars<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The symphysis menti fuse by 2 years of age<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The first permanent molar typically erupts around 6 years of age.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; T.M arthrography synovial spaces not detected except if ruptured .<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":41},{"section":"Exam 1 › Exam 1 b","front":"<b>Regarding the liver<\/b><br><div class='opt-line'><b>A.<\/b> The bare area lies to the right of the inferior vena cava (IVC)<\/div><br><div class='opt-line'><b>B.<\/b> The quadrate lobe is functionally part of the left lobe<\/div><br><div class='opt-line'><b>C.<\/b> The porta hepatis is enclosed between two layers of the lesser omentum<\/div><br><div class='opt-line'><b>D.<\/b> It is supplied entirely by the superior mesenteric artery in 2.5% of cases<\/div><br><div class='opt-line'><b>E.<\/b> Has hepatic veins which a  class='opt-line'><b>B.<\/b> With a non-grid film-screen system and a Molybdenum target, 16-20 kVp gives the highest soft tissue contrast<\/div><br><div class='opt-line'><b>C.<\/b> Double emulsion film is usually used<\/div><br><div class='opt-line'><b>D.<\/b> Soft tissue contrast depends on a high ratio of photoelectric effect to Compton absorption<\/div><br><div class='opt-line'><b>E.<\/b> A rhodium target and rhodium filter can be used for dense breasts<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Compression allows for lower kVp.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 26-30 kVp gives the highest soft tissue contrast for a non- grid film- screen system a Molybdenum target higher values required if a grid is used.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Single emulsion film is used for all mammography<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":35},{"section":"Exam 1 › Exam 1 c","front":"<b>Regarding insertion of a nephrostomy tube<\/b><br><div class='opt-line'><b>A.<\/b> A bleeding diathesis is an absolute contraindication<\/div><br><div class='opt-line'><b>B.<\/b> The risk of death from haemorrhage is 0.2%<\/div><br><div class='opt-line'><b>C.<\/b> Gross haematuria for 1-2 days is abnormal<\/div><br><div class='opt-line'><b>D.<\/b> Septic shock occurs in 0.1%<\/div><br><div class='opt-line'><b>E.<\/b> Haemorrhage can be treated by increasing the nephrostomy tube size<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Gross haematuria is common for 1-2 days after insertion.<\/div><div ict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 99mTc-pertechnetate is not trapped by the normal parathyroid glands.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 99m Tc- MIBI is trapped by both normal thyroid and normal parathyroid tissue but washes out of thyroid tissue more quickly<\/div>","due":36},{"section":"Exam 1 › Exam 1 c","front":"<b>Regarding the intravenous pyelogram<\/b><br><div class='opt-line'><b>A.<\/b> Calyceal detail is better demonstrated on ultrasound<\/div><br><div class='opt-line'><b>B.<\/b> An inferior venacaval filter is a contraindication to compression<\/div><br><div class='opt-line'><b>C.<\/b> The maximum nephrogram density is dependent on the peak plasma level of contrast media, the glomerulo- filtration rate, and the rate of resorption of sodium and water in the proximal convoluted tubule<\/div><br><div class='opt-line'><b>D.<\/b> Low osmolar contrast media produces greater pelvicalyceal distention than high osmolar contrast media<\/div><br><div class='opt-line'><b>E.<\/b> The peak nephrogram phase occurs slightly later with low osmolar contrast media than high osmolar contrast media<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Calyceal detail is better demonstrated on IVP.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; High osmolar contrast media produces greater pelvicalyceal distention.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":36},{"section":"Exam 1 › Exam 1 c","front":"<b>The following needle is appropriate to perform a lymphangiogram<\/b><br><div class='opt-line'><b>A.<\/b> A 20 gauge McCarthy needle<\/div><br><div class='opt-line'><b>B.<\/b> A 30 gauge Rabinov needle<\/div><br><div class='opt-line'><b>C.<\/b> A 20 gauge Rabinov needle<\/div><br><div class='opt-line'><b>D.<\/b> A 30 gauge McBerni needle<\/div><br><div class='opt-line'><b>E.<\/b> A 30 gauge McCarthy needle<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":36},{"section":"Exam 1 › Exam 1 c","front":"<b>The following statements are true regarding static renal scintigraphy<\/b><br><div class='opt-line'><b>A.<\/b> Renal involvement during a urinary tract infection can be demonstrated<\/div><br><div class='opt-line'><b>B.<\/b> Should not be performed to demonstrate scarring for at least one month following a UTI<\/div><br><div class='opt-line'><b>C.<\/b> Images acquired before and after a captopril challenge can be used to demonstrate intrarenal arterial abnormalities<\/div><br><div class='opt-line'><b>D.<\/b> Cannot differentiate between deteriorating function in one kidney and increased growth in the other<\/div><br><div class='opt-line'><b>E.<\/b> Is not indicated in a child with urinary incontinence<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A DMSA should be avoided for three months following a UTI to avoid FALSE positives.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; DMSA can differentiate between deteriorating function in one kidney and increased growth in the other as it gives an estimate of the mass of functioning cortex<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It is indicated for assessing underlying causes of urinary incontinence.<\/div>","due":37},{"section":"Exam 1 › Exam 1 c","front":"<b>Varicography<\/b><br><div class='opt-line'><b>A.<\/b> A superficial vein in the foot is punctured<\/div><br><div class='opt-line'><b>B.<\/b> The patient should initially be supine<\/div><br><div class='opt-line'><b>C.<\/b> The use of a ruler is required on the medial aspect to measure perforation<\/div><br><div class='opt-line'><b>D.<\/b> A thigh tourniquet is required<\/div><br><div class='opt-line'><b>E.<\/b> The patient should ultimately be placed head down<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The varicose vein is punctured<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The patient initially starts erect<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A ruler is put on the medial aspect of the leg to measure perforating vessels. No tourniquet is usually necessary.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":37},{"section":"Exam 1 › Exam 1 c","front":"<b>Regarding carotid Doppler examinations<\/b><br><div class='opt-line'><b>A.<\/b> The left vertebral artery originates directly from the aortic arch in 20%<\/div><br><div class='opt-line'><b>B.<\/b> Diastolic flow reversal is seen in the common carotid artery<\/div><br><div class='opt-line'><b>C.<\/b> Spectral broadening at the carotid bulb is normal<\/div><br><div class='opt-line'><b>D.<\/b> The resistive index of the internal carotid artery is twice that of the external carotid artery<\/div><br><div class='opt-line'><b>E.<\/b> At the carotid bifurcation, the internal carotid artery usually lies postero-lateral to the external carotid artery<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; in 5%<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Continuous forward flow is seen in the common carotid artery<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The resistive index of the internal carotid artery tends to be lower than that of the external carotid artery.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":38},{"section":"Exam 1 › Exam 1 c","front":"<b>Sialography The following are true of magnetic resonance imaging of the liver<\/b><br><div class='opt-line'><b>A.<\/b> Hepatic parenchyma is of higher signal than the spleen on STIR sequences<\/div><br><div class='opt-line'><b>B.<\/b> Following ingestion of magnetic iron oxide particles, the bowel returns high signal on both T1 and T2 weighted sequences<\/div><br><div class='opt-line'><b>C.<\/b> Hepatic vessels are low signal on both T1 and T2 weighted unenhanced sequences<\/div><br><div class='opt-line'><b>D.<\/b> Averaging throughout the respiratory cycle reduces movement artefact<\/div><br><div class='opt-line'><b>E.<\/b> Respiratory ordered phase-encoding reduces movement artefact<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The spleen returns very high signal on STIR sequences.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The bowel returns low signal on T2W sequences.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":38},{"section":"Exam 1 › Exam 1 c","front":"<b>Regarding the erect AXR<\/b><br><div class='opt-line'><b>A.<\/b> A gridded cassette should be used<\/div><br><div class='opt-line'><b>B.<\/b> The patient should be standing erect<\/div><br><div class='opt-line'><b>C.<\/b> Should be performed in expiration<\/div><br><div class='opt-line'><b>D.<\/b> Gonadal protection should routinely be used<\/div><br><div class='opt-line'><b>E.<\/b> The use of a slow screen cassette is appropriate<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The patient can be sitting down<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Preferably performed in inspiration<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Only men require gonadal protection<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A detail or fast screen combination is used<\/div>","due":38},{"section":"Exam 1 › Exam 1 c","front":"<b>Regarding internal biliary drainage<\/b><br><div class='opt-line'><b>A.<\/b> Balloon dilatation of benign strictures is contraindicated<\/div><br><div class='opt-line'><b>B.<\/b> Plastic stents occlude less frequently than metallic stents<\/div><br><div class='opt-line'><b>C.<\/b> Plastic stents are more prone to migration than metallic stents<\/div><br><div class='opt-line'><b>D.<\/b> The transhepatic tract is larger for plastic stents than metallic stents<\/div><br><div class='opt-line'><b>E.<\/b> Hilar strictures are best treated endoscopically → percutaneous<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Balloon dilatation is often used for benign strictures.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Metallic stents occlude less frequently than plastic stents.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Hilar strictures are generally best treated percutaneously.<\/div>","due":39},{"section":"Exam 1 › Exam 1 c","front":"<b>Diagnostic catheters are made of<\/b><br><div class='opt-line'><b>A.<\/b> Polyurethane<\/div><br><div class='opt-line'><b>B.<\/b> Polyethylene<\/div><br><div class='opt-line'><b>C.<\/b> Nylon<\/div><br><div class='opt-line'><b>D.<\/b> Teflon<\/div><br><div class='opt-line'><b>E.<\/b> Polyester<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span><\/div>","due":39},{"section":"Exam 1 › Exam 1 c","front":"<b>The following are true of CT of the paranasal sinuses<\/b><br><div class='opt-line'><b>A.<\/b> The nasal cycle alternates every 20-30 minutes<\/div><br><div class='opt-line'><b>B.<\/b> Windows of 2000/250 would be appropriate to demonstrate the bony components<\/div><br><div class='opt-line'><b>C.<\/b> The ostiomeatal complex is best demonstrated on axial scans<\/div><br><div class='opt-line'><b>D.<\/b> The turbinates are best demonstrated on coronal scans<\/div><br><div class='opt-line'><b>E.<\/b> The cribriform plate is best demonstrated on axial scans<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; every 2-3 hours<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The ostiomeatal complex is best demonstrated on coronal scans.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The cribriform plate is best demonstrated on coronal scans.<\/div>","due":40},{"section":"Exam 1 › Exam 1 c","front":"<b>Regarding ultrasonography of the spleen<\/b><br><div class='opt-line'><b>A.<\/b> The spleen decreases in size with age<\/div><br><div class='opt-line'><b>B.<\/b> Visualization is improved by deep inspiration<\/div><br><div class='opt-line'><b>C.<\/b> Visualization is improved by lying the patient on his right<\/div><br><div class='opt-line'><b>D.<\/b> Supernumerary spleens are seen in 30% at autopsy<\/div><br><div class='opt-line'><b>E.<\/b> Ultrasound guided biopsy of the spleen is contraindicated<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; deep inspiration brings the lung down beween the probe and the spleen so cant visualize spleen.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It is not contraindicated unless there is a bleeding diathesis.<\/div>","due":40},{"section":"Exam 1 › Exam 1 c","front":"<b>Meckel&#x27;s Diverticulum Radionuclide scan - Drugs administered during<\/b><br><div class='opt-line'><b>A.<\/b> Buscopan 10mgs IV<\/div><br><div class='opt-line'><b>B.<\/b> Glucagon - 1mg IV<\/div><br><div class='opt-line'><b>C.<\/b> Maxalon - 10mg IV<\/div><br><div class='opt-line'><b>D.<\/b> Pentagastrin IV.<\/div><br><div class='opt-line'><b>E.<\/b> Cimetidine PO<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":40},{"section":"Exam 2 › Exam 2 b","front":"<b>Regarding the paranasal sinuses<\/b><br><div class='opt-line'><b>A.<\/b> The frontal sinuses are usually visible by the age of two years<\/div><br><div class='opt-line'><b>B.<\/b> Pneumatization of the sphenoid sinus usually occurs at puberty<\/div><br><div class='opt-line'><b>C.<\/b> The maxillary sinuses are first to appear and radiologically visualized a few weeks after birth<\/div><br><div class='opt-line'><b>D.<\/b> The osteomeatal complex is where the maxillary, frontal, and posterior ethmoid sinuses drain<\/div><br><div class='opt-line'><b>E.<\/b> MRI is poor in demonstrating the paranasal sinuses<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The frontal sinuses are usually not visible until two years of age.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Pneumatization of the sphenoid sinus occurs at the age of three years.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The osteomeatal complex is where the maxillary, frontal, and anterior ethmoids drain.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; MRI is surprisingly good at demonstrating the sinuses since the bony septae have no signals outlined by high signal mucosa.<\/div>","due":33},{"section":"Exam 2 › Exam 2 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The brachiocephalic veins are formed at the midclavicular region<\/div><br><div class='opt-line'><b>B.<\/b> The right brachiocephalic vein lies anterolateral to its artery<\/div><br><div class='opt-line'><b>C.<\/b> The left brachiocephalic vein is longer than the right one<\/div><br><div class='opt-line'><b>D.<\/b> The superior vena cava is formed behind the junction of the first right costal cartilage with the manubrium<\/div><br><div class='opt-line'><b>E.<\/b> The only tributary of the superior vena cava is the azygos vein<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The brachiocephalic veins are formed at the medial end of the clavicle.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 2 › Exam 2 b","front":"<b>The annulus fibrosus of an intervertebral disc<\/b><br><div class='opt-line'><b>A.<\/b> Contains elastic tissue<\/div><br><div class='opt-line'><b>B.<\/b> Consists of fibrous layers perpendicular to each other<\/div><br><div class='opt-line'><b>C.<\/b> It is attached to the lower vertebral body only<\/div><br><div class='opt-line'><b>D.<\/b> Attaches to both anterior and posterior longitudinal ligaments<\/div><br><div class='opt-line'><b>E.<\/b> It has no sensory nerve supply<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The annulus does not contain elastic tissue.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The annulus attaches to both the upper and lower vertebral bodies.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It has sensory nerve supply.<\/div>","due":33},{"section":"Exam 2 › Exam 2 b","front":"<b>Regarding the accessory bones of the foot<\/b><br><div class='opt-line'><b>A.<\/b> Os trigonum is seen just anterior to the talus<\/div><br><div class='opt-line'><b>B.<\/b> Os peroneum is seen proximal to the base of the 5th metatarsal adjacent to the cuboid<\/div><br><div class='opt-line'><b>C.<\/b> Os peroneum may be multicentric<\/div><br><div class='opt-line'><b>D.<\/b> Os tibiale externum may be fused to the cuboid<\/div><br><div class='opt-line'><b>E.<\/b> Os vesalianum is seen at the base of the 1st metatarsal<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Os trigonum is posterior to the talus.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Os tibiale externum may be fused to the navicular.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Os vesalianum is seen at the base of the 5th metatarsal.<\/div>","due":34},{"section":"Exam 2 › Exam 2 b","front":"<b>Regarding the external ear<\/b><br><div class='opt-line'><b>A.<\/b> The auricle is composed of both hyaline and fibrocartilage<\/div><br><div class='opt-line'><b>B.<\/b> The external acoustic canal is composed of cartilage in its lateral two-thirds and bone in its medial one-third<\/div><br><div class='opt-line'><b>C.<\/b> The bony part of the external auditory meatus is entirely formed by the temporal bone<\/div><br><div class='opt-line'><b>D.<\/b> The tympanic membrane lies obliquely with its lateral surface facing downwards and forwards<\/div><br><div class='opt-line'><b>E.<\/b> The handle of the malleus is attached to the medial surface of the tympanic membrane<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The auricle is composed only of fibrocartilage.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; composed of cartilage in its lateral one third and bone in its medial two thirds<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":34},{"section":"Exam 2 › Exam 2 b","front":"<b>Regarding the mandible<\/b><br><div class='opt-line'><b>A.<\/b> The coronoid process gives attachment to the medial pterygoid<\/div><br><div class='opt-line'><b>B.<\/b> The mandibular foramen lies at the center of the medial surface of the ramus<\/div><br><div class='opt-line'><b>C.<\/b> The sphenomandibular ligament is attached to the lingula<\/div><br><div class='opt-line'><b>D.<\/b> The sublingual and submandibular glands are separated by the mylohyoid muscle<\/div><br><div class='opt-line'><b>E.<\/b> The digastric fossa lies below the midpoint of the two mylohyoid lines<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The coronoid process gives attachment to the temporalis muscle.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":34},{"section":"Exam 2 › Exam 2 b","front":"<b>Regarding the bones of the foot<\/b><br><div class='opt-line'><b>A.<\/b> Medial cuneiform articulates with 1st and 2nd metatarsals<\/div><br><div class='opt-line'><b>B.<\/b> The lateral cuneiform is the shortest of the three cuneiforms<\/div><br><div class='opt-line'><b>C.<\/b> The spring ligament is attached to the inferior margin of the navicular<\/div><br><div class='opt-line'><b>D.<\/b> The sustentaculum tali is a projection on the medial side of the talus<\/div><br><div class='opt-line'><b>E.<\/b> Ossification centers are present for all three cuneiforms by 4 years<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The intermediate cuneiform is the shortest of the three cuneiforms.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The sustentaculum tali is a projection of the calcaneum.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":35},{"section":"Exam 2 › Exam 2 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The oblique fissures extend from T6 posteriorly to the diaphragm anteroinferiorly<\/div><br><div class='opt-line'><b>B.<\/b> The left oblique fissure is more vertical in orientation when compared to the right<\/div><br><div class='opt-line'><b>C.<\/b> The horizontal fissure on the right side is at the level of the 4th costal cartilage<\/div><br><div class='opt-line'><b>D.<\/b> The horizontal fissure is absent in 30% of normal subjects<\/div><br><div class='opt-line'><b>E.<\/b> The azygos fissure has 4 pleural layers and is present in 1% of normal individuals<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The oblique fissures extend from T4/5, not T6.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The horizontal fissure is absent in only 10% of subjects.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":35},{"section":"Exam 2 › Exam 2 b","front":"<b>In the axilla<\/b><br><div class='opt-line'><b>A.<\/b> Teres major is behind the long head of triceps<\/div><br><div class='opt-line'><b>B.<\/b> Teres minor is supplied by a subscapular nerve<\/div><br><div class='opt-line'><b>C.<\/b> The axillary nerve supplies nothing in the axilla<\/div><br><div class='opt-line'><b>D.<\/b> The lateral group of lymph nodes receive lymph from the axillary tail of the breast<\/div><br><div class='opt-line'><b>E.<\/b> The axillary artery is divided into three parts by pectoralis minor<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Teres major is anterior to the long head of triceps.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Teres minor is supplied by a posterior branch of the axillary nerve.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The axillary tail drains to posterior axillary nodes.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":37},{"section":"Exam 2 › Exam 2 b","front":"<b>The bladder<\/b><br><div class='opt-line'><b>A.<\/b> Is supplied by the obturator artery in its lower part<\/div><br><div class='opt-line'><b>B.<\/b> Is covered by peritoneum superiorly<\/div><br><div class='opt-line'><b>C.<\/b> Drains to both internal and external iliac lymph nodes<\/div><br><div class='opt-line'><b>D.<\/b> The trigone is the area between the ureteral orifices and the external urethral orifice<\/div><br><div class='opt-line'><b>E.<\/b> Is drained by veins following the superior and inferior vesical arteries<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The trigone is the area between the ureteral orifices and the internal urethral orifice.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The veins draining the bladder form a plexus around the bladder neck.<\/div>","due":38},{"section":"Exam 2 › Exam 2 b","front":"<b>The following are true regarding the spinal cord<\/b><br><div class='opt-line'><b>A.<\/b> The spinal cord is about 45 cm long<\/div><br><div class='opt-line'><b>B.<\/b> The enlargements in the spinal cord lie opposite the lower cervical and lower thoracic vertebrae<\/div><br><div class='opt-line'><b>C.<\/b> The collection of all lumbar, sacral, and coccygeal nerves is called the filum terminale<\/div><br><div class='opt-line'><b>D.<\/b> The posterior median sulcus is deeper than the anterior median fissure<\/div><br><div class='opt-line'><b>E.<\/b> The spinal cord is slightly flattened anteroposteriorly<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The filum terminale does not include all the lumbar nerves but only the lower lumbar nerves.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The anterior median fissure is deeper than the posterior median sulcus.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":38},{"section":"Exam 2 › Exam 2 b","front":"<b>Regarding the stomach<\/b><br><div class='opt-line'><b>A.<\/b> The gastroesophageal junction usually lies at the level of T10<\/div><br><div class='opt-line'><b>B.<\/b> The incisura angularis is seen on the lesser curve<\/div><br><div class='opt-line'><b>C.<\/b> It may be supplied by a branch of the superior mesenteric artery<\/div><br><div class='opt-line'><b>D.<\/b> Lymph drainage is partially to nodes at the splenic hilum<\/div><br><div class='opt-line'><b>E.<\/b> The gastroduodenal vein drains the greater curvature<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The stomach is supplied by branches of the celiac artery only.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; There is no gastroduodenal vein.<\/div>","due":39},{"section":"Exam 2 › Exam 2 b","front":"<b>Concerning the suprarenal glands<\/b><br><div class='opt-line'><b>A.<\/b> The right suprarenal gland has a peritoneal covering on its lower half<\/div><br><div class='opt-line'><b>B.<\/b> The middle suprarenal artery is multiple in about 5% of cases<\/div><br><div class='opt-line'><b>C.<\/b> The right suprarenal gland is higher than the left<\/div><br><div class='opt-line'><b>D.<\/b> In cross-section, the right suprarenal gland is usually V-shaped<\/div><br><div class='opt-line'><b>E.<\/b> The left suprarenal gland is related to the medial border of the left kidney<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The middle suprarenal artery is multiple in greater than 30% of cases.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The left gland normally lies higher than the right.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":39},{"section":"Exam 2 › Exam 2 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The parapharyngeal spaces are filled with air<\/div><br><div class='opt-line'><b>B.<\/b> The parapharyngeal spaces are triangular in shape<\/div><br><div class='opt-line'><b>C.<\/b> The parapharyngeal spaces are always symmetrical<\/div><br><div class='opt-line'><b>D.<\/b> The atlas bone has no foramen transversarium<\/div><br><div class='opt-line'><b>E.<\/b> The interspinous distance in the cervical region is maximum between C6 and C7<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The parapharyngeal spaces are filled with soft tissue contents like lymphoid tissue, not air.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The parapharyngeal spaces can be asymmetrical.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The atlas does have a foramen transversarium.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The maximum interspinous distance is between C2 and C3.<\/div>","due":39},{"section":"Exam 2 › Exam 2 b","front":"<b>The radial artery<\/b><br><div class='opt-line'><b>A.<\/b> Arises from the brachial artery at the level of the neck of the radius<\/div><br><div class='opt-line'><b>B.<\/b> Gives off the anterior interosseous artery<\/div><br><div class='opt-line'><b>C.<\/b> Lies on brachioradialis in the upper forearm<\/div><br><div class='opt-line'><b>D.<\/b> Lies medial to the superficial branch of the radial nerve in the forearm<\/div><br><div class='opt-line'><b>E.<\/b> Forms the deep palmar arch<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The anterior interosseous artery is a branch of the ulnar artery.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Brachioradialis lies over the radial artery in the upper forearm.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":40},{"section":"Exam 2 › Exam 2 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The majority of the female urethra is embedded in the vaginal wall<\/div><br><div class='opt-line'><b>B.<\/b> The ampulla of the uterine tube is a dilatation at its outer end<\/div><br><div class='opt-line'><b>C.<\/b> The rectouterine pouch is the lowest part of the pelvic peritoneum<\/div><br><div class='opt-line'><b>D.<\/b> The infundibulum of the uterine tube is the portion just distal to the uterine opening<\/div><br><div class='opt-line'><b>E.<\/b> The uterine tube is supplied by a branch of the ovarian artery<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The infundibulum is at the distal end of the uterine tube.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":40},{"section":"Exam 2 › Exam 2 b","front":"<b>The rectus abdominis muscle<\/b><br><div class='opt-line'><b>A.<\/b> Is attached to the posterior surface of the pubic bone<\/div><br><div class='opt-line'><b>B.<\/b> Is adherent to the posterior rectus sheath at tendinous intersections<\/div><br><div class='opt-line'><b>C.<\/b> Is attached to the lower margin of the 6th, 7th, and 8th costal cartilages<\/div><br><div class='opt-line'><b>D.<\/b> Is related to the superior epigastric artery on its posterior surface<\/div><br><div class='opt-line'><b>E.<\/b> Arises by two heads, medial and lateral<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Rectus abdominis is attached to the front of the pubic bone.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Rectus abdominis is adherent to the anterior rectus sheath.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Rectus abdominis is attached to the 5th, 6th, and 7th costal cartilages.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":41},{"section":"Exam 2 › Exam 2 b","front":"<b>Regarding the limbic lobe<\/b><br><div class='opt-line'><b>A.<\/b> It includes the cingulate gyrus, splenial gyrus, and dentate gyrus<\/div><br><div class='opt-line'><b>B.<\/b> The hippocampus lies in the floor of the inferior horn of the lateral ventricle<\/div><br><div class='opt-line'><b>C.<\/b> The posterior end of the hippocampus has the appearance of a &quot;paw,&quot; also called the pes hippocampi<\/div><br><div class='opt-line'><b>D.<\/b> The efferent pathway from the hippocampus to the mammillary bodies is called the fornix<\/div><br><div class='opt-line'><b>E.<\/b> The posterior pillar of the fornix is called the crus of the fornix<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The anterior end of the hippocampus forms the pes hippocampi.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":41},{"section":"Exam 2 › Exam 2 b","front":"<b>Regarding the renal tract<\/b><br><div class='opt-line'><b>A.<\/b> In a duplex system, the upper moiety ureter inserts into the bladder below that draining the lower moiety<\/div><br><div class='opt-line'><b>B.<\/b> The indentations of fetal lobation are situated between calyces<\/div><br><div class='opt-line'><b>C.<\/b> The left renal vein is retroaortic in 1%<\/div><br><div class='opt-line'><b>D.<\/b> The left renal vein splits to surround the aorta in 7%<\/div><br><div class='opt-line'><b>E.<\/b> Perinephric fat is most abundant at the upper poles<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The left renal vein is retroaortic in 3.5%.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Perinephric fat is most abundant at the lower poles.<\/div>","due":42},{"section":"Exam 2 › Exam 2 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> Chamberlain’s line joins the posterior tip of the hard palate to the anterior lip of the foramen magnum<\/div><br><div class='opt-line'><b>B.<\/b> McGregor’s line is from the posterior tip of the hard palate to the base of the occiput<\/div><br><div class='opt-line'><b>C.<\/b> Each typical vertebra has 3 primary and 3 secondary centers of ossification<\/div><br><div class='opt-line'><b>D.<\/b> Axis (C2 vertebra) has 2 extra ossification centers when compared to atlas (C1 vertebra)<\/div><br><div class='opt-line'><b>E.<\/b> In axial CT, intervertebral foramen appears narrower in cuts through its upper and lower ends<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; to the posterior lip of foramen magnum<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Each typical vertebra has 3 primary and 5 secondary centers of ossification.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":42},{"section":"Exam 2 › Exam 2 c","front":"<b>Regarding breast ultrasound<\/b><br><div class='opt-line'><b>A.<\/b> A 7-10 MHz linear array probe is appropriate<\/div><br><div class='opt-line'><b>B.<\/b> Fatty tissue is highly reflective<\/div><br><div class='opt-line'><b>C.<\/b> During lactation, lactiferous ducts can measure 8 mm in diameter<\/div><br><div class='opt-line'><b>D.<\/b> It is useful to evaluate the retro-areolar area<\/div><br><div class='opt-line'><b>E.<\/b> Stand-off techniques are required to visualize the skin<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Fatty tissue is poorly reflective.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Acoustic shadows are generated by the dense connective tissue around lactiferous ducts, making it difficult to evaluate the retro-areolar area.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 2 › Exam 2 c","front":"<b>Regarding dacrocystography<\/b><br><div class='opt-line'><b>A.<\/b> 0.5 to 2.0 mL of contrast is injected each side<\/div><br><div class='opt-line'><b>B.<\/b> The superior canaliculus is preferable<\/div><br><div class='opt-line'><b>C.<\/b> A 16-gauge cannula is appropriate<\/div><br><div class='opt-line'><b>D.<\/b> Lipiodol is an acceptable contrast media<\/div><br><div class='opt-line'><b>E.<\/b> Simultaneous bilateral injections are usually performed<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Inferior canaliculus is preferably cannulated.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; An 18-gauge cannula is used.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 2 › Exam 2 c","front":"<b>On an occipito-frontal x-ray with 20 degrees of caudal angulation the following can be seen<\/b><br><div class='opt-line'><b>A.<\/b> The petrous ridge, seen projected within the orbits<\/div><br><div class='opt-line'><b>B.<\/b> The coronal suture<\/div><br><div class='opt-line'><b>C.<\/b> The foramen rotundum<\/div><br><div class='opt-line'><b>D.<\/b> The foramen ovale<\/div><br><div class='opt-line'><b>E.<\/b> The zygomatic arch<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The petrous ridge should be level with the lower margin of the orbit, and the beam emerges through the nasion.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The petrous ridge is seen within the orbits on an untilted occipito-frontal projection.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span><\/div>","due":33},{"section":"Exam 2 › Exam 2 c","front":"<b>The umbilical vein<\/b><br><div class='opt-line'><b>A.<\/b> Carries oxygenated blood to the inferior vena cava via the ductus venosus<\/div><br><div class='opt-line'><b>B.<\/b> Forms the ligamentum teres in the newborn<\/div><br><div class='opt-line'><b>C.<\/b> Forms the left main portal vein in the newborn<\/div><br><div class='opt-line'><b>D.<\/b> Forms the ligamentum venosum in the newborn<\/div><br><div class='opt-line'><b>E.<\/b> Forms the median umbilical ligament<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The umbilical arteries form the superior vesical arteries and the medial umbilical ligaments.<\/div>","due":33},{"section":"Exam 2 › Exam 2 c","front":"<b>Regarding Gallium citrate scans<\/b><br><div class='opt-line'><b>A.<\/b> Gallium accumulates in both tumors and infection<\/div><br><div class='opt-line'><b>B.<\/b> Localization of abnormal uptake may require subtraction studies<\/div><br><div class='opt-line'><b>C.<\/b> Images are acquired at 6 and 24 hours<\/div><br><div class='opt-line'><b>D.<\/b> Gallium is excreted via the liver<\/div><br><div class='opt-line'><b>E.<\/b> Is taken up by normal breast tissue<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Images are acquired at 48 and 72 hours.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 2 › Exam 2 c","front":"<b>Radionuclide bone scan<\/b><br><div class='opt-line'><b>A.<\/b> Maximum dose of 100 MBq<\/div><br><div class='opt-line'><b>B.<\/b> Uses hMPAO<\/div><br><div class='opt-line'><b>C.<\/b> Uses MDP<\/div><br><div class='opt-line'><b>D.<\/b> Uses Tc<\/div><br><div class='opt-line'><b>E.<\/b> Uses pertechnetate<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The maximum dose is 500-600 MBq.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span><\/div>","due":33},{"section":"Exam 2 › Exam 2 c","front":"<b>The following centering points are correct<\/b><br><div class='opt-line'><b>A.<\/b> Oblique hand - 3rd metacarpal head<\/div><br><div class='opt-line'><b>B.<\/b> Ball-catcher&#x27;s hand - 5th metacarpal head<\/div><br><div class='opt-line'><b>C.<\/b> Lateral wrist - radial styloid<\/div><br><div class='opt-line'><b>D.<\/b> PA wrist - midshaft 3rd metacarpal<\/div><br><div class='opt-line'><b>E.<\/b> Lateral elbow - 2.5 cm inferior to lateral epicondyle<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; An oblique view of the hand is centered on the 5th metacarpal head.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; PA view of the wrist is centered midway between the radial and ulnar styloid.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; lateral elbow is centered on the lateral epicondyle.<\/div>","due":33},{"section":"Exam 2 › Exam 2 c","front":"<b>Regarding tenography (contrast-enhanced screening of tendons)<\/b><br><div class='opt-line'><b>A.<\/b> The needle is inserted under screening<\/div><br><div class='opt-line'><b>B.<\/b> MRI has better resolution<\/div><br><div class='opt-line'><b>C.<\/b> Contrast is injected to confirm position<\/div><br><div class='opt-line'><b>D.<\/b> 5-10 ml of 0.5% Bupivacaine is injected<\/div><br><div class='opt-line'><b>E.<\/b> Tenography is predominantly a therapeutic procedure<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The needle is inserted under palpation.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Tenography can show very fine irregularity in tendon details not seen on MRI.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":33},{"section":"Exam 2 › Exam 2 c","front":"<b>The following are true of computed tomography of the liver<\/b><br><div class='opt-line'><b>A.<\/b> The liver is usually around 10 HU less than the spleen in attenuation on unenhanced scans<\/div><br><div class='opt-line'><b>B.<\/b> Hepatic parenchyma attenuation peaks at 40-60 seconds after commencing an intravenous injection of contrast<\/div><br><div class='opt-line'><b>C.<\/b> The average increase in attenuation of hepatic parenchyma following intravenous contrast media is approximately 80 HU<\/div><br><div class='opt-line'><b>D.<\/b> The hepatic vessels are of low attenuation than the parenchyma on unenhanced scans<\/div><br><div class='opt-line'><b>E.<\/b> Normally functioning hepatocytes return to their non-enhanced attenuation values by 6 hours following intravenous contrast media<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The liver is 8-10 HU higher than the spleen due to glycogen and iron.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The average increase in density of the liver following contrast is around 45 HU.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Normally functioning hepatocytes remain hyperdense at 6 hours following contrast injection.<\/div>","due":35},{"section":"Exam 2 › Exam 2 c","front":"<b>The following are contraindications to bronchography<\/b><br><div class='opt-line'><b>A.<\/b> Bleeding diathesis<\/div><br><div class='opt-line'><b>B.<\/b> Asthma<\/div><br><div class='opt-line'><b>C.<\/b> Acute chest infection<\/div><br><div class='opt-line'><b>D.<\/b> Recent bronchoscopy<\/div><br><div class='opt-line'><b>E.<\/b> Poor respiratory reserve<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Bronchoscopy can cause reversible dilatation of the airways, which can mimic bronchiectasis.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":35},{"section":"Exam 2 › Exam 2 c","front":"<b>Endoscopy<\/b><br><div class='opt-line'><b>A.<\/b> Upper GI perforation rate of 0.1%<\/div><br><div class='opt-line'><b>B.<\/b> High dysphagia is a contraindication<\/div><br><div class='opt-line'><b>C.<\/b> Cricopharyngeal region is well demonstrated<\/div><br><div class='opt-line'><b>D.<\/b> Cricopharyngeus is approximately 15 cm from the incisors<\/div><br><div class='opt-line'><b>E.<\/b> Gastroesophageal junction is approximately 25 cm from cricopharyngeus<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The perforation rate of an upper GI endoscopy is 0.018%.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The cricopharyngeal region is particularly difficult to visualize by endoscopy.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":36},{"section":"Exam 2 › Exam 2 c","front":"<b>Regarding ultrasound of the prostate<\/b><br><div class='opt-line'><b>A.<\/b> The transitional zone is hyperechoic<\/div><br><div class='opt-line'><b>B.<\/b> The central zone is hyperechoic<\/div><br><div class='opt-line'><b>C.<\/b> The peripheral zone is more reflective than the transitional zone<\/div><br><div class='opt-line'><b>D.<\/b> The normal prostate is approximately 2.5 cm in AP diameter<\/div><br><div class='opt-line'><b>E.<\/b> Seminal vesicles are normally up to 1 cm in width<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The transitional zone is hypoechoic and cannot be separated from the central zone.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":37},{"section":"Exam 2 › Exam 2 c","front":"<b>When imaging the renal tract<\/b><br><div class='opt-line'><b>A.<\/b> A cross-kidneys film is centered on the xiphisternum and performed in arrested inspiration<\/div><br><div class='opt-line'><b>B.<\/b> A 45-degree posterior oblique projection demonstrates the kidneys best<\/div><br><div class='opt-line'><b>C.<\/b> Renal tomography is performed at the level of one-third of the AP width of the patient<\/div><br><div class='opt-line'><b>D.<\/b> The narrower the angular swing during tomography, the narrower the section<\/div><br><div class='opt-line'><b>E.<\/b> The angular swing for nephrotomograms is between 15 and 25 degrees<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The centering point is the lower costal margin, and the film is performed in expiration.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A 35-degree posterior oblique projection demonstrates the kidneys best.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The narrower the angular swing, the thicker the section.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The angle of swing is usually between 25-40 degrees.<\/div>","due":37},{"section":"Exam 2 › Exam 2 c","front":"<b>Regarding oral cholecystography<\/b><br><div class='opt-line'><b>A.<\/b> Gallbladder opacification with iopanoic acid is unaffected by fat malabsorption<\/div><br><div class='opt-line'><b>B.<\/b> An intravenous cholangiogram within the past week is a contraindication<\/div><br><div class='opt-line'><b>C.<\/b> Is contraindicated in acute cholecystitis<\/div><br><div class='opt-line'><b>D.<\/b> Is unlikely to be helpful if the serum bilirubin is less than 34 micromols/liter<\/div><br><div class='opt-line'><b>E.<\/b> Previous cholecystectomy is a contraindication<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Iopanoic acid requires fat in the diet for absorption.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The serum bilirubin should be less than 34 micromols/liter.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":37},{"section":"Exam 2 › Exam 2 c","front":"<b>Small bowel enema<\/b><br><div class='opt-line'><b>A.<\/b> Incurs a higher radiation dose than a small bowel meal<\/div><br><div class='opt-line'><b>B.<\/b> Contraindicated in small bowel obstruction<\/div><br><div class='opt-line'><b>C.<\/b> Excellent for detecting perforations<\/div><br><div class='opt-line'><b>D.<\/b> Apply local anesthesia to nostril<\/div><br><div class='opt-line'><b>E.<\/b> Apply local anesthesia to throat<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Barium suspension can be used in small bowel obstruction.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Perforation is an absolute contraindication.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It is dangerous due to the risk of aspiration.<\/div>","due":38},{"section":"Exam 2 › Exam 2 c","front":"<b>Vascular catheters<\/b><br><div class='opt-line'><b>A.<\/b> Polyurethane catheters are stiffer than polyethylene<\/div><br><div class='opt-line'><b>B.<\/b> Polyethylene catheters are used with a Teflon-coated wire<\/div><br><div class='opt-line'><b>C.<\/b> Pigtail catheters have end holes<\/div><br><div class='opt-line'><b>D.<\/b> Pigtail catheters have side holes in the curved portion<\/div><br><div class='opt-line'><b>E.<\/b> Polyethylene catheters are softer than polyurethane<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Teflon-coated wires are used due to their higher coefficient of friction.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Side holes of pigtail catheters are in the straight portion.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":38},{"section":"Exam 2 › Exam 2 c","front":"<b>When placing an intrahepatic portosystemic shunt<\/b><br><div class='opt-line'><b>A.<\/b> The transfemoral approach is used<\/div><br><div class='opt-line'><b>B.<\/b> A stent is placed between the portal vein and the IVC<\/div><br><div class='opt-line'><b>C.<\/b> Follow-up is by ultrasound with Doppler<\/div><br><div class='opt-line'><b>D.<\/b> Normal portal flow is hepatopedal<\/div><br><div class='opt-line'><b>E.<\/b> Normal portal venous flow velocity is 15-18 cm per second<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The transjugular approach is used.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The stent is placed between a hepatic vein and an intrahepatic portal vein.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":39},{"section":"Exam 2 › Exam 2 c","front":"<b>When imaging the thyroid gland<\/b><br><div class='opt-line'><b>A.<\/b> With Tc-pertechnetate, imaging should commence one hour following injection<\/div><br><div class='opt-line'><b>B.<\/b> With I-sodium iodide, imaging should commence at one hour following injection<\/div><br><div class='opt-line'><b>C.<\/b> Amiodarone treatment is likely to result in poor uptake<\/div><br><div class='opt-line'><b>D.<\/b> The thyroid gland should take up Tc-pertechnetate in a similar way to the salivary glands<\/div><br><div class='opt-line'><b>E.<\/b> Potassium perchlorate should be given prior to the study to block the salivary glands<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Imaging starts at 15 minutes following injection.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Imaging starts at 3-4 hours following injection.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; If thyroid uptake is similar to the salivary glands, this suggests hypothyroidism.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Potassium perchlorate would also cause thyroid blockade.<\/div>","due":41},{"section":"Exam 2 › Exam 2 c","front":"<b>Regarding MRI of the liver<\/b><br><div class='opt-line'><b>A.<\/b> Magnetic iron oxide particles are taken up predominantly by hepatocytes<\/div><br><div class='opt-line'><b>B.<\/b> Following injection of magnetic iron oxide particles, normal liver parenchyma returns reduced signal on T2W images<\/div><br><div class='opt-line'><b>C.<\/b> Gd-DTPA is taken up predominantly by Kupffer cells<\/div><br><div class='opt-line'><b>D.<\/b> Optimal imaging following Gd-BOPTA is at 20-30 seconds following injection<\/div><br><div class='opt-line'><b>E.<\/b> Following injection of Gadolinium chelate, the timing of liver enhancement parallels that of dynamic CT<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Magnetic iron oxide particles are taken up by Kupffer cells.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Gd-DTPA is protein-bound and taken up by hepatocytes.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Optimal imaging following Gd-BOPTA is at 30-60 minutes.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":41},{"section":"Exam 2 › Exam 2 c","front":"<b>Coronary Angiography positions adopted in<\/b><br><div class='opt-line'><b>A.<\/b> Left main stem - right lateral<\/div><br><div class='opt-line'><b>B.<\/b> Left main stem - RAO<\/div><br><div class='opt-line'><b>C.<\/b> Right coronary - AP<\/div><br><div class='opt-line'><b>D.<\/b> Right coronary - RAO<\/div><br><div class='opt-line'><b>E.<\/b> LAD - AP<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The left main stem is demonstrated by a left lateral view.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":41},{"section":"Exam 3 › Exam 3 b","front":"<b>The portal vein<\/b><br><div class='opt-line'><b>A.<\/b> Is formed by the union of inferior mesenteric and splenic veins<\/div><br><div class='opt-line'><b>B.<\/b> Is approx. 8 cm long<\/div><br><div class='opt-line'><b>C.<\/b> Has the left gastric vein as a tributary<\/div><br><div class='opt-line'><b>D.<\/b> Drains the entire gut from lower oesophagus to upper anal canal<\/div><br><div class='opt-line'><b>E.<\/b> Ascends posterior to the first part of the duodenum<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The portal vein is formed by the union of the superior mesenteric and splenic veins.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":35},{"section":"Exam 3 › Exam 3 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The pulmonary trunk divides immediately after leaving the fibrous pericardium<\/div><br><div class='opt-line'><b>B.<\/b> The division of the pulmonary trunks is poster
