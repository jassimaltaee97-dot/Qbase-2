ior to the left main bronchus<\/div><br><div class='opt-line'><b>C.<\/b> The artery for the right upper lobe passes anterior to the right upper lobe bronchus<\/div><br><div class='opt-line'><b>D.<\/b> The pulmonary trunk is attached to the aortic arch at its concavity by the ligamentum arteriosum<\/div><br><div class='opt-line'><b>E.<\/b> The normal venous pressure of pulmonary vessels is 10mm of mercury<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The division of the pulmonary trunk is anterior to the left main bronchus.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - It is the left pulmonary artery that is attached to the aortic arch by the ligamentum arteriosum.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The normal venous pressure of pulmonary vessels is 3mm of mercury.<\/div>","due":35},{"section":"Exam 3 › Exam 3 b","front":"<b>The following are true<\/b><br><div class='opt-line'><b>A.<\/b> The thoracic inlet measures about 15cm wide and 5cm anteroposteriorly<\/div><br><div class='opt-line'><b>B.<\/b> The thoracic inlet is widest from side to side<\/div><br><div class='opt-line'><b>C.<\/b> The body of sternum is formed by four pieces of sternebrae<\/div><br><div class='opt-line'><b>D.<\/b> The transverse crest of the ribs is attached to the intervertebral discs<\/div><br><div class='opt-line'><b>E.<\/b> The subclavius muscle is attached to the inferior surface of the first rib<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The thoracic inlet is 10cm wide.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The subclavius muscle is attached to the superior surface at the anterior end of the first rib.<\/div>","due":35},{"section":"Exam 3 › Exam 3 b","front":"<b>Regarding the hyoglossus muscle<\/b><br><div class='opt-line'><b>A.<\/b> It is crossed superficially by the lingual nerve<\/div><br><div class='opt-line'><b>B.<\/b> It has the glossopharyngeal nerve deep to it<\/div><br><div class='opt-line'><b>C.<\/b> It is derived from suboccipital myotomes<\/div><br><div class='opt-line'><b>D.<\/b> It protracts the tongue<\/div><br><div class='opt-line'><b>E.<\/b> It has the lingual artery running superficial to it<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The lingual artery runs deep to the hyoglossus muscle.<\/div>","due":35},{"section":"Exam 3 › Exam 3 b","front":"<b>Regarding the spinal cord<\/b><br><div class='opt-line'><b>A.<\/b> The conus medullaris lies at the level of L3 at birth<\/div><br><div class='opt-line'><b>B.<\/b> The filum terminale is attached to the second sacral vertebra<\/div><br><div class='opt-line'><b>C.<\/b> The dorsal and ventral roots unite 2cm beyond the intervertebral foramen to form the spinal nerve<\/div><br><div class='opt-line'><b>D.<\/b> The anterior median sulcus is deeper than the posterior median sulcus<\/div><br><div class='opt-line'><b>E.<\/b> The central canal extends 5-6mm into the filum terminale<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The filum terminale is attached to the first coccygeal segment.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The roots unite at the intervertebral foramen.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":36},{"section":"Exam 3 › Exam 3 b","front":"<b>The following are true<\/b><br><div class='opt-line'><b>A.<\/b> The tuberculum sellae is a constituent of the sphenoid bone<\/div><br><div class='opt-line'><b>B.<\/b> The carotid sulcus is a constituent of the body of sphenoid bone<\/div><br><div class='opt-line'><b>C.<\/b> The trigeminal nerve supplies motor fibres to muscles of mastication<\/div><br><div class='opt-line'><b>D.<\/b> The trigeminal nerve arises from the midbrain<\/div><br><div class='opt-line'><b>E.<\/b> The trigeminal nerve arises from the posterior surface of the brain stem<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The trigeminal nerve arises from the pons.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The trigeminal nerve arises from the anterior surface of the brain stem.<\/div>","due":37},{"section":"Exam 3 › Exam 3 b","front":"<b>Regarding the middle ear<\/b><br><div class='opt-line'><b>A.<\/b> The lateral and medial walls curve inwards and are about 6mm apart in its middle aspect<\/div><br><div class='opt-line'><b>B.<\/b> The corda tympani nerve passes between the tympanic membrane and the handle of malleus<\/div><br><div class='opt-line'><b>C.<\/b> The epitympanic recess only accommodates the head of malleus and body of incus<\/div><br><div class='opt-line'><b>D.<\/b> The promontory is formed by the second turn of cochlea<\/div><br><div class='opt-line'><b>E.<\/b> The oval window lies below the round window<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - They are 2mm apart at the middle and 6mm apart at the roof.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The first turn of cochlea forms the promontory.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The oval window lies above the round window.<\/div>","due":38},{"section":"Exam 3 › Exam 3 b","front":"<b>Concerning the hip joint<\/b><br><div class='opt-line'><b>A.<\/b> Gluteus maximus is an extensor<\/div><br><div class='opt-line'><b>B.<\/b> The psoas bursa lies between the ilio-femoral ligament and the capsule<\/div><br><div class='opt-line'><b>C.<\/b> The nerve to rectus femoris supplies the joint<\/div><br><div class='opt-line'><b>D.<\/b> The acetabular labrum is deficient inferiorly and continues as the transverse ligament<\/div><br><div class='opt-line'><b>E.<\/b> The pubofemoral ligament attaches to the superior part of the capsule<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The psoas bursa lies superficial to the ilio-femoral ligament and capsule.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The pubofemoral ligament attaches to the inferior part of the capsule.<\/div>","due":39},{"section":"Exam 3 › Exam 3 b","front":"<b>Regarding radiography of the elbow<\/b><br><div class='opt-line'><b>A.<\/b> The beam is centered 2.5 cm proximal to the epicondyles in the AP view<\/div><br><div class='opt-line'><b>B.<\/b> The posterior fat pad is not usually visible<\/div><br><div class='opt-line'><b>C.<\/b> An anterior fat pad indicates a joint effusion<\/div><br><div class='opt-line'><b>D.<\/b> Both elbows should be x-rayed when a sole injury is suspected in a child<\/div><br><div class='opt-line'><b>E.<\/b> The epiphysis of the radial head appears at 4 years<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The beam is centered 2.5 cm distal to the epicondyles in the AP view.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; An anterior fat pad may be a normal finding<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Bilateral x-rays are not typically needed unless there is suspicion of a bilateral injury.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":39},{"section":"Exam 3 › Exam 3 b","front":"<b>The prostate gland<\/b><br><div class='opt-line'><b>A.<\/b> has smooth muscle continuous with the bladder<\/div><br><div class='opt-line'><b>B.<\/b> Is normally broader than it is long<\/div><br><div class='opt-line'><b>C.<\/b> has a lower surface called the base<\/div><br><div class='opt-line'><b>D.<\/b> Lies below the levator ani complex<\/div><br><div class='opt-line'><b>E.<\/b> Drains to internal and external iliac nodes<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The upper surface of the prostate is referred to as the base, not the lower surface.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The prostate lies above the levator ani complex<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":39},{"section":"Exam 3 › Exam 3 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The incidence of cervical ribs is 1-2%<\/div><br><div class='opt-line'><b>B.<\/b> The accessory hemidiaphragm is more common on the right side<\/div><br><div class='opt-line'><b>C.<\/b> The incidence of bilateral cervical ribs is 5%<\/div><br><div class='opt-line'><b>D.<\/b> The right diaphragm is normally higher than the left by about 2cm<\/div><br><div class='opt-line'><b>E.<\/b> Bony thoracic anomalies are more common in the lower most ribs<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The incidence of bilateral cervical ribs is 50%.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Thoracic anomalies are more common in the upper four ribs.<\/div>","due":39},{"section":"Exam 3 › Exam 3 b","front":"<b>Sites of porto-systemic anastomosis include<\/b><br><div class='opt-line'><b>A.<\/b> Lower end of oesophagus<\/div><br><div class='opt-line'><b>B.<\/b> Upper part of anal canal<\/div><br><div class='opt-line'><b>C.<\/b> Quadrate lobe of liver<\/div><br><div class='opt-line'><b>D.<\/b> Periumbilical region<\/div><br><div class='opt-line'><b>E.<\/b> Cecum<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The quadrate lobe is not a site of porto-systemic anastomosis.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The cecum is not a site for porto-systemic anastomosis.<\/div>","due":40},{"section":"Exam 3 › Exam 3 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The descending colon has a mesentery in 20% of adults<\/div><br><div class='opt-line'><b>B.<\/b> The arteria pancreatica magna is a branch of the splenic artery<\/div><br><div class='opt-line'><b>C.<\/b> The liver is developed from foregut<\/div><br><div class='opt-line'><b>D.<\/b> The prepyloric vein (of Mayo) drains the first and second parts of the duodenum<\/div><br><div class='opt-line'><b>E.<\/b> Ileal arteries form a series of arcades in the mesentery<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The prepyloric vein drains the first 2.5 cm of duodenum only.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":40},{"section":"Exam 3 › Exam 3 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The cranial dura mater is in two layers<\/div><br><div class='opt-line'><b>B.<\/b> The falx cerebri is narrower at its posterior attachment<\/div><br><div class='opt-line'><b>C.<\/b> The diaphragma sellae is attached to all four clinoid processes<\/div><br><div class='opt-line'><b>D.<\/b> The sheath of meninges around the optic nerve extends up to the optic canal<\/div><br><div class='opt-line'><b>E.<\/b> The spinal dura mater extends up to the second sacral vertebra<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The falx cerebri is narrower at its anterior attachment and therefore it has a sickle shape<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The sheath of meninges around the optic nerve extends up to the sclera<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":40},{"section":"Exam 3 › Exam 3 b","front":"<b>Regarding the scapula<\/b><br><div class='opt-line'><b>A.<\/b> The coracoid process projects anteriorly from the upper border<\/div><br><div class='opt-line'><b>B.<\/b> The inferior angle usually lies over the seventh rib<\/div><br><div class='opt-line'><b>C.<\/b> An ossification centre for the body appears at the eighth intrauterine week<\/div><br><div class='opt-line'><b>D.<\/b> It gives a large attachment for subscapularis on its dorsal surface<\/div><br><div class='opt-line'><b>E.<\/b> The coracoclavicular ligament is made up of two parts, conoid and trapezoid<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Subscapularis attaches to the ventral surface, not the dorsal surface.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":41},{"section":"Exam 3 › Exam 3 b","front":"<b>Regarding the anterior abdominal wall<\/b><br><div class='opt-line'><b>A.<\/b> The preperitoneal fat line is caused by fatty tissue between visceral and parietal peritoneum<\/div><br><div class='opt-line'><b>B.<\/b> The properitoneal fat line is absent in approximately 18% of cases<\/div><br><div class='opt-line'><b>C.<\/b> External oblique muscle is partially inserted into the linea alba<\/div><br><div class='opt-line'><b>D.<\/b> The median umbilical ligament is the remnant of the umbilical artery<\/div><br><div class='opt-line'><b>E.<\/b> Transversus abdominis does not insert into the linea alba<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The preperitoneal fat line is caused by fatty tissue between the anterior abdominal wall and peritoneum<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The median umbilical ligament is the remnant of the urachus Transversus abdominis<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Transversus abdominis does insert into the linea alba.<\/div>","due":41},{"section":"Exam 3 › Exam 3 b","front":"<b>Regarding the basal ganglia<\/b><br><div class='opt-line'><b>A.<\/b> The caudate nucleus is highly curved and lies within the concavity of the lateral ventricle<\/div><br><div class='opt-line'><b>B.<\/b> The lentiform nucleus is made of a smaller medial globus pallidus and larger lateral putamen<\/div><br><div class='opt-line'><b>C.<\/b> The claustrum is a thin sheet of white matter and lies between putamen and insula<\/div><br><div class='opt-line'><b>D.<\/b> The amygdaloid body is part of the caudate nucleus<\/div><br><div class='opt-line'><b>E.<\/b> The globus pallidus has a lower signal than surrounding brain in MRI<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The claustrum is a thin sheet of grey matter.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":42},{"section":"Exam 3 › Exam 3 b","front":"<b>Regarding normal variation<\/b><br><div class='opt-line'><b>A.<\/b> A secondary ossification centre may be seen in the supero-lateral aspect of the patella<\/div><br><div class='opt-line'><b>B.<\/b> Fibular spurs may be seen below the head of the fibula pointing in a cranial direction<\/div><br><div class='opt-line'><b>C.<\/b> A groove on the medial femoral condyle may be caused by popliteus tendon<\/div><br><div class='opt-line'><b>D.<\/b> On an AP radiograph the tibial tubercle may cause a lucent area over the tibia<\/div><br><div class='opt-line'><b>E.<\/b> On a lateral radiograph a projection on the posterior surface of the tibia may represent the insertion of soleus muscle<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Fibular spurs typically point in a caudal direction.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; -The lateral condyle is grooved by popliteus tendon<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":42},{"section":"Exam 3 › Exam 3 b","front":"<b>In an axial CT image at the level of the hip joints<\/b><br><div class='opt-line'><b>A.<\/b> Seminal vesicles are seen posterior to the bladder in the male<\/div><br><div class='opt-line'><b>B.<\/b> Sartorius muscle is seen lateral to the tensor fasciae latae<\/div><br><div class='opt-line'><b>C.<\/b> The femoral artery lies on pectineus muscle<\/div><br><div class='opt-line'><b>D.<\/b> The inferior pubic ramus is seen superior to the femoral head<\/div><br><div class='opt-line'><b>E.<\/b> Rectus femoris muscle is in contact with the greater trochanter of the femur<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Sartorius is medial to the tensor fasciae latae.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The femoral vein lies between the artery and pectineus<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The inferior pubic ramus lies inferior to the femoral head.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The rectus femoris is not in contact with the greater trochanter.<\/div>","due":42},{"section":"Exam 3 › Exam 3 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The azygous vein enters the superior vena cava on its lateral aspect<\/div><br><div class='opt-line'><b>B.<\/b> The SVC has 2-3 valves near its termination<\/div><br><div class='opt-line'><b>C.<\/b> The SVC may be left sided in 0.3% of cases<\/div><br><div class='opt-line'><b>D.<\/b> The SVC is related immediately to the right phrenic nerve<\/div><br><div class='opt-line'><b>E.<\/b> The SVC is formed at level T3/T4<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The azygous vein enters the posterior aspect of the superior vena cava.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The SVC is valveless.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":43},{"section":"Exam 3 › Exam 3 c","front":"<b>Radionuclide bone imaging - 3-phase imaging<\/b><br><div class='opt-line'><b>A.<\/b> Arterial phase at 1-2 frames per second<\/div><br><div class='opt-line'><b>B.<\/b> Arterial phase lasts 5 minutes<\/div><br><div class='opt-line'><b>C.<\/b> Blood pool phase images are taken every minute for 3 minutes<\/div><br><div class='opt-line'><b>D.<\/b> Blood pool phase is at 5 minutes<\/div><br><div class='opt-line'><b>E.<\/b> Delayed views are the same as for static imaging<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The arterial phase lasts 1-2 minutes, not 5.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The blood pool phase images are taken for 1-3 minute يعني تصور متواصل كل ثانية من الدقيقة الأول للثالثة مش مرة كل دقيقة<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":35},{"section":"Exam 3 › Exam 3 c","front":"<b>Regarding lymphoscintigraphy<\/b><br><div class='opt-line'><b>A.<\/b> 1-3 mls of Tc-nanocolloid is injected subcutaneously<\/div><br><div class='opt-line'><b>B.<\/b> Static images are acquired over 3 hours<\/div><br><div class='opt-line'><b>C.<\/b> Complete blockage is indicated by absent lumbo-sacral uptake at 24 hours<\/div><br><div class='opt-line'><b>D.<\/b> Ischiorectal injections demonstrate the iliopelvic lymphatics<\/div><br><div class='opt-line'><b>E.<\/b> Rib periosteal injections can be used to demonstrate the internal mammary chain<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 0.1 to 0.3 mls is injected subcutaneously<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":39},{"section":"Exam 3 › Exam 3 c","front":"<b>Regarding ultrasound of the testicle<\/b><br><div class='opt-line'><b>A.<\/b> The tunica albuginea is highly reflective<\/div><br><div class='opt-line'><b>B.<\/b> The mediastinum testes is a thin reflective band lying in the short axis of the testis<\/div><br><div class='opt-line'><b>C.<\/b> The epididymis is hypoechoic when compared to the testis<\/div><br><div class='opt-line'><b>D.<\/b> It is normal to have some free scrotal fluid<\/div><br><div class='opt-line'><b>E.<\/b> The rete testis is a small intratesticular tubular structure adjacent to the epididymis<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; _The mediastinum testes lies in the long axis of the testis on the same side as the epididymis and represents condensation of connective tissue<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The epididymis is hyperechoic compared to the testis.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":39},{"section":"Exam 3 › Exam 3 c","front":"<b>When imaging the prostate<\/b><br><div class='opt-line'><b>A.<\/b> The seminal vesicles appear as a bow-tie shaped highly echogenic structure on ultrasound<\/div><br><div class='opt-line'><b>B.<\/b> The peripheral zone is distinguishable from the transition zone on T1W MRI<\/div><br><div class='opt-line'><b>C.<\/b> The peripheral zone is distinguishable from the transitional zone on T2W MRI<\/div><br><div class='opt-line'><b>D.<\/b> During transrectal prostate biopsy at least six fine needle aspirate samples should be performed<\/div><br><div class='opt-line'><b>E.<\/b> Hematuria is a recognised complication following transrectal ultrasound biopsy of the prostate<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The seminal vesicles appear as low echogenicity structures.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The peripheral zone is not distinguishable from the transition zone on T1W MRI.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Core biopsies are required, with at least an 18-gauge needle.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":39},{"section":"Exam 3 › Exam 3 c","front":"<b>Regarding percutaneous cholangiography<\/b><br><div class='opt-line'><b>A.<\/b> Active cholangitis is an absolute contraindication<\/div><br><div class='opt-line'><b>B.<\/b> Non-dilatation of the biliary tree is a contraindication<\/div><br><div class='opt-line'><b>C.<\/b> Prophylactic antibiotics are required<\/div><br><div class='opt-line'><b>D.<\/b> Is contraindicated in hydatid disease<\/div><br><div class='opt-line'><b>E.<\/b> Being unfit for surgery is a relative contraindication<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Active cholangitis is a relative contraindication.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Non-dilatation is not a contraindication.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":39},{"section":"Exam 3 › Exam 3 c","front":"<b>SMA Angiography<\/b><br><div class='opt-line'><b>A.<\/b> A coeliac angiogram should be performed prior to a sub-angio<\/div><br><div class='opt-line'><b>B.<\/b> Bowel preparation is required<\/div><br><div class='opt-line'><b>C.<\/b> Abdominal compression is required<\/div><br><div class='opt-line'><b>D.<\/b> Arterial phase - 2 films per second for six seconds is appropriate<\/div><br><div class='opt-line'><b>E.<\/b> Venous phase - 1 per second for six seconds is appropriate<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - A coeliac angiogram is not mandatory prior to SMA angiography.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; _Patients should be nil by mouth for four hours Nil by mouth : means no food or drink for a certain period before a procedure Bowel preparation: means preparing the intestines before a procedure like a colonoscopy or X-ray imaging of the colon. It typically involves using special medications or laxatives to clear the intestines of waste and gas,<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Venous phase is taken at 1 frame per second for 20 seconds.<\/div>","due":39},{"section":"Exam 3 › Exam 3 c","front":"<b>NIh catheters<\/b><br><div class='opt-line'><b>A.<\/b> Have no end hole<\/div><br><div class='opt-line'><b>B.<\/b> Have no side holes<\/div><br><div class='opt-line'><b>C.<\/b> Are inserted through a sheath<\/div><br><div class='opt-line'><b>D.<\/b> Are excellent selective arterial catheters<\/div><br><div class='opt-line'><b>E.<\/b> Can be used for cerebral angiography<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - NIh catheters have side holes.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; only best for pulmonary artery<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - NIh catheters are specifically used for pulmonary angiography.<\/div>","due":39},{"section":"Exam 3 › Exam 3 c","front":"<b>When using ultrasound to image the head and neck<\/b><br><div class='opt-line'><b>A.<\/b> The facial nerve can be demonstrated in the parotid gland in 50% of cases<\/div><br><div class='opt-line'><b>B.<\/b> Swallowing can improve visualisation of the retrosternal goitre<\/div><br><div class='opt-line'><b>C.<\/b> The submental approach is used to ultrasound the base of the tongue<\/div><br><div class='opt-line'><b>D.<\/b> Lymph nodes of less than 5 mm in length cannot be accurately detected<\/div><br><div class='opt-line'><b>E.<\/b> Ultrasound can be used to visualise the vocal cords<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The facial nerve can be seen in 30% of cases.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Lymph nodes of 2 mm or greater can be accurately detected.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":40},{"section":"Exam 3 › Exam 3 c","front":"<b>During lymphangiography of the lower limb<\/b><br><div class='opt-line'><b>A.<\/b> It is normal to see less than 5 vessels entering the inguinal nodes<\/div><br><div class='opt-line'><b>B.<\/b> It is normal to see contrast media in the vessels at 24 hours<\/div><br><div class='opt-line'><b>C.<\/b> The paraaortic lymph nodes do not normally extend laterally beyond the tips of the transverse processes<\/div><br><div class='opt-line'><b>D.<\/b> It is common to see a gap in the chain of lymph nodes at L5 on the right<\/div><br><div class='opt-line'><b>E.<\/b> The left supraclavicular glands rarely fill after pedal lymphangiography<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - It is normal to see 10-15 vessels entering the inguinal nodes.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Contrast media should be intradural by 24 hours.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":40},{"section":"Exam 3 › Exam 3 c","front":"<b>The following are cantering points correct<\/b><br><div class='opt-line'><b>A.<\/b> Lateral thoracic spine - 2.5 cms anterior to the spinous process of T6<\/div><br><div class='opt-line'><b>B.<\/b> AP lumbar spine - midline of the lower costal margin<\/div><br><div class='opt-line'><b>C.<\/b> Lateral lumbar spine - 10 cms anterior to the spinous process of L3<\/div><br><div class='opt-line'><b>D.<\/b> Right posterior oblique of lumbar spine - lower costal margin in the mid-axillary line<\/div><br><div class='opt-line'><b>E.<\/b> Coned lateral of L5/S1 - 7.5 cms anterior to the L5 spinous process<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 5 cms anterior to the spinous process of T6<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Midclavicular line at the level of the lower costal margin on the raised side<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":40},{"section":"Exam 3 › Exam 3 c","front":"<b>Regarding pelvic sonography<\/b><br><div class='opt-line'><b>A.<\/b> A retroverted uterus is demonstrated better by transabdominal than transvaginal scanning<\/div><br><div class='opt-line'><b>B.<\/b> Higher frequency transducers are required for transabdominal sonography than transvaginal sonography<\/div><br><div class='opt-line'><b>C.<\/b> Transvaginal sonography requires a full bladder<\/div><br><div class='opt-line'><b>D.<\/b> Transabdominal sonography requires a full bladder<\/div><br><div class='opt-line'><b>E.<\/b> When a full bladder is required, over distention can occur<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - A retroverted uterus is better demonstrated by transvaginal scanning.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Transvaginal scanning uses higher frequency transducers (5-7.5 MHz).<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Transvaginal scanning requires an empty bladder.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":41},{"section":"Exam 3 › Exam 3 c","front":"<b>Regarding oral cholecystography<\/b><br><div class='opt-line'><b>A.<\/b> Minor side effects are experienced in 15%<\/div><br><div class='opt-line'><b>B.<\/b> Can induce thyrotoxicosis<\/div><br><div class='opt-line'><b>C.<\/b> Can induce gout<\/div><br><div class='opt-line'><b>D.<\/b> Can precipitate toxicity of protein-bound drugs<\/div><br><div class='opt-line'><b>E.<\/b> Reliably demonstrates the duct<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Minor side effects occur in 50% of cases.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Cholecystography may not reliably demonstrate the duct.<\/div>","due":41},{"section":"Exam 3 › Exam 3 c","front":"<b>Small bowel enema intubation<\/b><br><div class='opt-line'><b>A.<\/b> The catheter may not pass into the duodenum due to coiling in the fundus<\/div><br><div class='opt-line'><b>B.<\/b> Use double-backed manoeuvre to get out of fundus<\/div><br><div class='opt-line'><b>C.<\/b> Turn patient right side down when using a weighted tip catheter<\/div><br><div class='opt-line'><b>D.<\/b> Inject contrast to outline antrum/duodenum<\/div><br><div class='opt-line'><b>E.<\/b> If difficult to intubate the duodenum, turn patient prone<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":41},{"section":"Exam 3 › Exam 3 c","front":"<b>CT of the oesophagus<\/b><br><div class='opt-line'><b>A.<\/b> Positive oral contrast is advised<\/div><br><div class='opt-line'><b>B.<\/b> 2% gastrograffin solution can be used<\/div><br><div class='opt-line'><b>C.<\/b> Prone views are preferable<\/div><br><div class='opt-line'><b>D.<\/b> Maxolon 10 mg IV is routinely administered<\/div><br><div class='opt-line'><b>E.<\/b> CT is imaging modality of choice for staging<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Water is the preferable contrast media.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Buscopan is more commonly administered.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":41},{"section":"Exam 3 › Exam 3 c","front":"<b>The following are true regarding contrast media for bronchography<\/b><br><div class='opt-line'><b>A.<\/b> Aqueous Dionosil is appropriate<\/div><br><div class='opt-line'><b>B.<\/b> Lipiodol is appropriate<\/div><br><div class='opt-line'><b>C.<\/b> Conray 240 is appropriate<\/div><br><div class='opt-line'><b>D.<\/b> Non-ionic Dimer is appropriate<\/div><br><div class='opt-line'><b>E.<\/b> Iohexol 300 is better than Iotrolan 300<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Dionosil is no longer used.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; lipiodol not used<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; conray is HOCM which is extremely dangerous as it can cause severe pulmonary oedema when aspirated.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Iotrolan 300 is better than Iohexol 300 for bronchography.<\/div>","due":41},{"section":"Exam 3 › Exam 3 c","front":"<b>Regarding micturating cystograms in the infant<\/b><br><div class='opt-line'><b>A.<\/b> Prophylactic antibiotics are used<\/div><br><div class='opt-line'><b>B.<\/b> Sedation is advisable<\/div><br><div class='opt-line'><b>C.<\/b> Contrast media induced cystitis is a recognised complication<\/div><br><div class='opt-line'><b>D.<\/b> A 5 French feeding tube is used to catheterise<\/div><br><div class='opt-line'><b>E.<\/b> The catheter is rapidly withdrawn during micturition<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Sedation increases the risk of bladder rupture from overfilling.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":42},{"section":"Exam 3 › Exam 3 c","front":"<b>Regarding MIBG scans<\/b><br><div class='opt-line'><b>A.<\/b> Myocardial uptake is normal<\/div><br><div class='opt-line'><b>B.<\/b> Reserpine can result in a false negative scan<\/div><br><div class='opt-line'><b>C.<\/b> Images are acquired at 30 minutes and 3 hours<\/div><br><div class='opt-line'><b>D.<\/b> Injection can result in hypertension<\/div><br><div class='opt-line'><b>E.<\/b> Amiodarone can result in a false negative scan<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Images are acquired at 4 and 24 hours.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Tricyclic antidepressants, beta blockers, and phenylephrine can cause a false negative scan.<\/div>","due":42},{"section":"Exam 3 › Exam 3 c","front":"<b>Coronary Angiography<\/b><br><div class='opt-line'><b>A.<\/b> Catheterisation of the right main coronary is relatively easier than the left<\/div><br><div class='opt-line'><b>B.<\/b> Left main stem catheterisation is the first study to be performed<\/div><br><div class='opt-line'><b>C.<\/b> LV study is performed to look at left ventricle movement<\/div><br><div class='opt-line'><b>D.<\/b> LV study is performed to look at mitral valve function<\/div><br><div class='opt-line'><b>E.<\/b> An arch aortogram is done to check the aortic valve function<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Left main stem catheterisation is often easier.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A left ventriclular study (ventriculogram) should be performed first.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":42},{"section":"Exam 3 › Exam 3 c","front":"<b>The following are appropriate centering points<\/b><br><div class='opt-line'><b>A.<\/b> Trauma obliques - mid clavicle<\/div><br><div class='opt-line'><b>B.<\/b> Lateral cervical spine - 2.5 cms inferior to the angle of the mandible<\/div><br><div class='opt-line'><b>C.<\/b> Lateral lumbar spine - 2.5 cms anterior to L3 spinous process<\/div><br><div class='opt-line'><b>D.<\/b> Odontoid peg - centre of the mouth<\/div><br><div class='opt-line'><b>E.<\/b> AP thoracic spine - midway between the manubrium and the xiphisternum<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - Lateral lumbar spine should be centered 5cm anterior to L3 spinous process.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":42},{"section":"Exam 3 › Exam 3 c","front":"<b>The following knee MRI sequences best identify the following structures<\/b><br><div class='opt-line'><b>A.<\/b> Sagittal gradient echo - menisci<\/div><br><div class='opt-line'><b>B.<\/b> Volume sagittal T2 - medial collateral ligaments<\/div><br><div class='opt-line'><b>C.<\/b> Sagittal volume - ACL<\/div><br><div class='opt-line'><b>D.<\/b> Axial T1 - medial retinaculum<\/div><br><div class='opt-line'><b>E.<\/b> Sagittal volume GE - fibular lateral ligament<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The medial collateral ligaments are best seen on coronal T1 sequences.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The lateral collateral ligament is best seen on coronal T1 sequences.<\/div>","due":43},{"section":"Exam 4 › Exam 4 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The venous drainage of the vertebral column is by valveless veins<\/div><br><div class='opt-line'><b>B.<\/b> The conus lies at the level of T12 vertebra at birth<\/div><br><div class='opt-line'><b>C.<\/b> The spinal cord is elliptical in cross-section with its greater diameter from front to back<\/div><br><div class='opt-line'><b>D.<\/b> The anterior median sulcus contains a pair of anterior spinal arteries<\/div><br><div class='opt-line'><b>E.<\/b> On a lateral view of the facet joint, the cavity is S-shaped<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The conus lies at L3 at birth.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The greatest diameter of the spinal cord is from side to side<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; There is only one anterior spinal artery<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":31}, e'>FALSE<\/span> &mdash; tensor tympani tendon is attached to handle of malleus<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The auditory tube opens via the anterior wall The tegmen tympani<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The tegmen tympani separates the middle ear cavity from the middle cranial fossa<\/div>","due":31},{"section":"Exam 4 › Exam 4 b","front":"<b>The superficial inguinal lymph nodes receive lymph from<\/b><br><div class='opt-line'><b>A.<\/b> Cervix<\/div><br><div class='opt-line'><b>B.<\/b> Buttock<\/div><br><div class='opt-line'><b>C.<\/b> Testis<\/div><br><div class='opt-line'><b>D.<\/b> Umbilicus<\/div><br><div class='opt-line'><b>E.<\/b> Glans penis<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Cervix drains to external and internal iliac nodes.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Testis drains to para-aortic nodes.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The glans penis drains to deep inguinal nodes<\/div>","due":32},{"section":"Exam 4 › Exam 4 b","front":"<b>The following statements are true<\/b><br><div class='opt-line'><b>A.<\/b> The sacroiliac joint (SIJ) is a primary cartilaginous joint<\/div><br><div class='opt-line'><b>B.<\/b> The sacrotuberous ligament is attached to the transverse tubercles of the sacrum<\/div><br><div class='opt-line'><b>C.<\/b> The sacrospinous ligament becomes broader as it passes laterally<\/div><br><div class='opt-line'><b>D.<\/b> The sacrococcygeal joint is a symphysis<\/div><br><div class='opt-line'><b>E.<\/b> The iliolumbar ligament is attached to the L5 transverse process<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The SIJ is an atypical synovial joint.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It narrows as it passes laterally.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 4 › Exam 4 b","front":"<b>Regarding the bony pelvis<\/b><br><div class='opt-line'><b>A.<\/b> The subpubic angle is greater in females<\/div><br><div class='opt-line'><b>B.<\/b> The sacrococcygeal joint is a typical synovial joint<\/div><br><div class='opt-line'><b>C.<\/b> Ossification centres for ilium, ischium and pubis all appear before birth<\/div><br><div class='opt-line'><b>D.<\/b> The lesser sciatic notch lies above the ischial spine<\/div><br><div class='opt-line'><b>E.<\/b> The pubis ossifies in membranous tissue<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The sacrococcygeal joint is a symphysis.<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It lies below the ischial spine.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The pubis ossifies in cartilage<\/div>","due":32},{"section":"Exam 4 › Exam 4 b","front":"<b>The following are true<\/b><br><div class='opt-line'><b>A.<\/b> The pulmonary veins enter the mediastinum anterior to the pulmonary arteries<\/div><br><div class='opt-line'><b>B.<\/b> The pulmonary veins on the left often unite and enter the left atrium as a single vessel<\/div><br><div class='opt-line'><b>C.<\/b> The bronchial arteries arise from the thoracic aorta in div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 4 › Exam 4 b","front":"<b>The following are true<\/b><br><div class='opt-line'><b>A.<\/b> The artery of Heubner is a branch of the middle cerebral artery<\/div><br><div class='opt-line'><b>B.<\/b> The posterior choroidal artery is a branch of the posterior cerebral artery<\/div><br><div class='opt-line'><b>C.<\/b> The pericallosal artery is a branch of the anterior cerebral artery<\/div><br><div class='opt-line'><b>D.<\/b> The lenticulostriate artery is a branch of the middle cerebral artery<\/div><br><div class='opt-line'><b>E.<\/b> The anterior choroidal artery is a branch of the internal carotid artery<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; It is a branch of the anterior cerebral artery.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 4 › Exam 4 b","front":"<b>The following joints are of the synovial type in the thoracic cage<\/b><br><div class='opt-line'><b>A.<\/b> Costovertebral joints<\/div><br><div class='opt-line'><b>B.<\/b> Costotransverse joints<\/div><br><div class='opt-line'><b>C.<\/b> Manubriosternal joints<\/div><br><div class='opt-line'><b>D.<\/b> Costochondral joint between first costal cartilage and sternum<\/div><br><div class='opt-line'><b>E.<\/b> Costochondral joints between second to seventh costal cartilage and sternum<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The man  class='opt-line'><b>B.<\/b> The body of the corpus callosum lies below the free edge of falx cerebri<\/div><br><div class='opt-line'><b>C.<\/b> Splenium is the thickened anterior end of corpus callosum<\/div><br><div class='opt-line'><b>D.<\/b> The posterior limb of the internal capsule lies between the lentiform nucleus and thalamus<\/div><br><div class='opt-line'><b>E.<\/b> The posterior most fibres of the internal capsule are occupied by auditory fibres<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Corpus callosum is white matter fibres of commissural type.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; - The splenium is the posterior end of the corpus callosum.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":44},{"section":"Exam 4 › Exam 4 c","front":"<b>The following statements are true of Technetium 99m labelled iminodiacetic acid analogue liver scans<\/b><br><div class='opt-line'><b>A.<\/b> A recent meal can result in a false-positive scan<\/div><br><div class='opt-line'><b>B.<\/b> An accessory cystic duct can result in a false-positive scan<\/div><br><div class='opt-line'><b>C.<\/b> Previous cholecystectomy results in a false-positive scan<\/div><br><div class='opt-line'><b>D.<\/b> Acalculous cholecystitis can result in a false-positive scan<\/div><br><div class='opt-line'><b>E.<\/b> A duodenal diverticulum can result in a false-positive scan<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; false negative<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; false negative<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; A duodenal diverticulum does not typically result in a false-positive scan.<\/div>","due":30},{"section":"Exam 4 › Exam 4 c","front":"<b>MRI sequences to look at the triangular fibrocartilage complex (TFCC) of the wrist<\/b><br><div class='opt-line'><b>A.<\/b> Coronal T1<\/div><br><div class='opt-line'><b>B.<\/b> Coronal T2<\/div><br><div class='opt-line'><b>C.<\/b> Sagittal T1<\/div><br><div class='opt-line'><b>D.<\/b> Sagittal STIR<\/div><br><div class='opt-line'><b>E.<\/b> Axial T2<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Sagittal T1 is not ideal for evaluating the TFCC.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Sagittal sequences are poor at looking at TFCC<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; T2* (T2 star NOT T2)<\/div>","due":30},{"section":"Exam 4 › Exam 4 c","front":"<b>On a submento-vertical projection, the following can be seen<\/b><br><div class='opt-line'><b>A.<\/b> The foramen rotundum<\/div><br><div class='opt-line'><b>B.<\/b> The odontoid peg<\/div><br><div class='opt-line'><b>C.<\/b> The foramen rotundum<\/div><br><div class='opt-line'><b>D.<\/b> The foramen spinosum<\/div><br><div class='opt-line'><b>E.<\/b> The lamdoid suture<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The lamdoid suture is typically visualized in a lateral skull X-ray.<\/div>","due":32},{"section":"Exam 4 › Exam 4 c","front":"<b>CT Pneumocolon<\/b><br><div class='opt-line'><b>A.<\/b> 10 mm sections advised<\/div><br><div class='opt-line'><b>B.<\/b> Rectal contrast is necessary<\/div><br><div class='opt-line'><b>C.<\/b> IV Maxolon 10 mg is routinely administered<\/div><br><div class='opt-line'><b>D.<\/b> No negative contrast is necessary<\/div><br><div class='opt-line'><b>E.<\/b> Full bowel preparation is essential<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; 5 mm sections are advised.<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; No positive rectal contrast should be used<\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; muscle relaxant is used NOT maloxon which is antiemetic drug(metoclopramide)<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Negative contrast is necessary.<\/div><div class='ans-line'><b>E.<\/b> <span class='verdict true'>TRUE<\/span><\/div>","due":32},{"section":"Exam 4 › Exam 4 c","front":"<b>Regarding ultrasound of the kidneys in a neonate<\/b><br><div class='opt-line'><b>A.<\/b> The renal cortex is thin and more reflective than the liver<\/div><br><div class='opt-line'><b>B.<\/b> The pyramids may appear large and hypoechoic<\/div><br><div class='opt-line'><b>C.<\/b> The normal bladder wall thickness when empty is 1 cm regardless of age<\/div><br><div class='opt-line'><b>D.<\/b> The kidneys are best assessed in the prone position<\/div><br><div class='opt-line'><b>E.<\/b> Renal length increases by 2 mm for every week of gestation in the fetus<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; The normal bladder wall thickness when empty is 0.3-0.5 cm.<\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Renal length increases by 1 mm per week in the fetus.<\/div>","due":33},{"section":"Exam 4 › Exam 4 c","front":"<b>An antegrade pyelogram<\/b><br><div class='opt-line'><b>A.<\/b> Is contraindicated in ureteral diversion<\/div><br><div class='opt-line'><b>B.<\/b> Is contraindicated in renal hydatid disease<\/div><br><div class='opt-line'><b>C.<\/b> Arteriovenous fistulae are a recognised complication<\/div><br><div class='opt-line'><b>D.<\/b> Pneumothorax is a recognised complication<\/div><br><div class='opt-line'><b>E.<\/b> Macroscopic haematuria is seen in 30% of cases<\/div>","back":"<div class='ans-line'><b>A.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Antegrade pyelography is performed because a retrograde pyelogram is not possible in patients with a ureteral diversion<\/div><div class='ans-line'><b>B.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>C.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>D.<\/b> <span class='verdict true'>TRUE<\/span><\/div><div class='ans-line'><b>E.<\/b> <span class='verdict false'>FALSE<\/span> &mdash; Macroscopic haematuria is seen in 50% of cases.<\/div>","due":33},{"section":"Exam 4 › Exam 4 c","front":"<b>Regarding ultrasound of the adrenal glands<\/b><br><div class='opt-line'><b>A.<\/b> The left adrenal gland is more commonly visualised than the right<\/div><br><div class='opt-line'><b>B.<\/b> The adrenal cortex and medulla can be easily differentiated<\/div><br><div class='opt-line'><b>C.<\/b> An adrenal gland may be simulated by an accessory spleen<\/div><br><div class='opt-line'><b>D.<\/b> An adrenal gland may be simulated by the crux of the diaphragm<\/div><br><div class='o
